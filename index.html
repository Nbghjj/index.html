<!DOCTYPE html>
<html lang="am">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>AYAT BINGO — Ultra Compact</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;padding:12px;background:#120c24;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.container{max-width:480px;margin:auto}

.screen{display:none}
.screen.active{display:block !important}

.panel{background:#1f143a;border:1px solid #3c2a6d;border-radius:14px;padding:16px;margin-bottom:12px}
.hero{text-align:center;background:linear-gradient(135deg,#2c1b4d,#1f143a)}
.hero h1{margin:4px 0;color:#f39c12;font-size:28px}.muted{color:#a08cc4;font-size:13px}
.badge{display:inline-block;background:#27ae60;color:#fff;padding:5px 10px;border-radius:20px;font-size:11px}
.btn{width:100%;border:0;border-radius:9px;padding:14px;font-weight:700;font-size:15px;cursor:pointer;margin-top:8px}
.btn:disabled{opacity:0.4;cursor:not-allowed}
.primary{background:linear-gradient(135deg,#f39c12,#f1c40f);color:#111}
.green{background:#27ae60;color:#fff}.dark{background:#3c2a6d;color:#fff}
.purple{background:#7928ca;color:#fff}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.input{width:100%;padding:12px;margin:6px 0 12px;border-radius:8px;border:1px solid #4b377d;background:#120c24;color:#fff;font-size:14px}
.smallbtn{border:0;border-radius:7px;padding:8px 11px;background:#7928ca;color:#fff;font-weight:700;cursor:pointer}

/* Selected Card Box */
.card-preview{text-align:center;background:#2c1b4d;border:2px dashed #f39c12;border-radius:10px;padding:15px;margin:12px 0}
.card-num{font-size:32px;font-weight:900;color:#f39c12;margin-top:4px}

/* Pop-up Modal Styling */
.modal-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.85);z-index:100;justify-content:center;align-items:center;padding:15px}
.modal-overlay.active{display:flex}
.modal-content{background:#1f143a;border:1px solid #523a8a;border-radius:14px;width:100%;max-width:400px;max-height:80vh;display:flex;flex-direction:column;padding:16px}
.modal-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;overflow-y:auto;padding:8px 0;margin-top:10px}
.grid-item{background:#3c2a6d;border:1px solid #523a8a;border-radius:6px;padding:10px 0;text-align:center;font-weight:700;cursor:pointer}
.grid-item.selected{background:#f39c12;color:#111}

/* Bingo Board CSS */
.bingo{background:#fff;color:#000;border:3px solid #ff69b4;border-radius:12px;padding:9px;max-width:350px;margin:0 auto}
.head{display:grid;grid-template-columns:repeat(5,1fr);background:#ff69b4;color:#fff;border-radius:6px;padding:6px;text-align:center;font-weight:800;font-size:18px}
.matrix{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-top:7px}
.cell{aspect-ratio:1;border:2px solid #000;border-radius:4px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;cursor:pointer;background:#fff}
.cell.free{background:#ff69b4;color:#fff}
.cell.marked{background:#f39c12;color:#000}
</style>
</head>
<body>

<main id="app" class="container">
  <!-- 1. HOME SCREEN -->
  <section id="home" class="screen active">
    <div class="panel hero">
      <h1>AYAT BINGO</h1>
      <p class="muted">የእውነተኛ ብር ቢንጎ ጨዋታ</p>
      <span class="badge">REAL MONEY GAME</span>
    </div>

    <div class="panel">
      <div class="top">
        <div><b>Ayat Bingo Room</b><div class="muted">መግቢያ: 20 ETB</div></div>
      </div>
      <button id="joinBtn" class="btn primary">ጨዋታ ጀምር (JOIN ROOM)</button>
    </div>
  </section>

  <!-- 2. CARD SELECT SCREEN (COMPACT & FAST) -->
  <section id="select" class="screen">
    <div class="panel">
      <div class="top">
        <button class="smallbtn backHome">← ተመለስ</button>
        <b>ካርድ መምረጫ</b>
      </div>

      <!-- Selected Card Display -->
      <div class="card-preview">
        <div class="muted">የተመረጠው ካርድ</div>
        <div id="cardDisplay" class="card-num">#--</div>
      </div>

      <!-- Quick Random Pick Button -->
      <button id="randomBtn" class="btn purple">🔀 በዕድል ምረጥ (Random Card)</button>

      <!-- Direct Input -->
      <div style="margin-top:12px;">
        <label class="muted">ወይም ቁጥር በቀጥታ ያስገቡ (1-300):</label>
        <input id="directInput" type="number" min="1" max="300" class="input" placeholder="ምሳሌ፡ 88">
      </div>

      <!-- Modal Trigger Button -->
      <button id="openModalBtn" class="btn dark">📋 ሙሉ ዝርዝሩን አይተህ ምረጥ</button>

      <button id="startBtn" class="btn primary" style="margin-top:15px;" disabled>ካርዱን አረጋግጥና ግባ</button>
    </div>
  </section>

  <!-- 3. GAME PLAY SCREEN -->
  <section id="game" class="screen">
    <div class="panel">
      <div class="top">
        <b>AYAT BINGO — LIVE</b>
        <button class="smallbtn backHome">ውጣ</button>
      </div>
      <div class="bingo" style="margin-top:15px;">
        <div class="head"><span>B</span><span>I</span><span>N</span><span>G</span><span>O</span></div>
        <div id="matrix" class="matrix"></div>
        <div class="muted" style="text-align:center;margin-top:6px;color:#333;">Card #<span id="cardNoLabel">--</span></div>
      </div>
      <button class="btn green" style="margin-top:12px;">BINGO! 🎉</button>
    </div>
  </section>
</main>

<!-- 300 CARDS POP-UP MODAL -->
<div id="cardsModal" class="modal-overlay">
  <div class="modal-content">
    <div class="top">
      <b>ካርድ ይምረጡ (1-300)</b>
      <button id="closeModalBtn" class="smallbtn">✕ ዝጋ</button>
    </div>
    <div id="modalGrid" class="modal-grid"></div>
  </div>
</div>

<script>
(() => {
  "use strict";
  const tg = window.Telegram?.WebApp;
  tg?.ready(); tg?.expand();

  let selectedCard = null;

  function showScreen(id) {
    document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
    document.getElementById(id)?.classList.add("active");
  }

  function setCard(num) {
    if(num >= 1 && num <= 300) {
      selectedCard = num;
      document.getElementById("cardDisplay").textContent = `#${num}`;
      document.getElementById("directInput").value = num;
      document.getElementById("startBtn").disabled = false;
    } else {
      selectedCard = null;
      document.getElementById("cardDisplay").textContent = "#--";
      document.getElementById("startBtn").disabled = true;
    }
  }

  // Random Selection Button
  document.getElementById("randomBtn").onclick = () => {
    const randomNum = Math.floor(Math.random() * 300) + 1;
    setCard(randomNum);
  };

  // Direct Input Handler
  document.getElementById("directInput").oninput = (e) => {
    setCard(Number(e.target.value));
  };

  // Modal Setup
  const modal = document.getElementById("cardsModal");
  const modalGrid = document.getElementById("modalGrid");

  document.getElementById("openModalBtn").onclick = () => {
    if(modalGrid.children.length === 0) {
      for(let i = 1; i <= 300; i++) {
        const item = document.createElement("div");
        item.className = "grid-item";
        item.textContent = i;
        item.onclick = () => {
          setCard(i);
          modal.classList.remove("active");
        };
        modalGrid.appendChild(item);
      }
    }
    modal.classList.add("active");
  };

  document.getElementById("closeModalBtn").onclick = () => modal.classList.remove("active");

  // Navigation & Game Start
  document.getElementById("joinBtn").onclick = () => showScreen("select");
  document.querySelectorAll(".backHome").forEach(b => b.onclick = () => showScreen("home"));

  document.getElementById("startBtn").onclick = () => {
    if(!selectedCard) return;
    showScreen("game");
    renderBoard(selectedCard);
  };

  function renderBoard(cardId) {
    const matrix = document.getElementById("matrix");
    matrix.innerHTML = "";
    document.getElementById("cardNoLabel").textContent = cardId;
    
    for(let i = 0; i < 25; i++) {
      const cell = document.createElement("div");
      cell.className = "cell";
      if(i === 12) {
        cell.textContent = "FREE";
        cell.classList.add("free", "marked");
      } else {
        cell.textContent = Math.floor(Math.random() * 75) + 1;
        cell.onclick = () => cell.classList.toggle("marked");
      }
      matrix.appendChild(cell);
    }
  }
})();
</script>
</body>
</html>
