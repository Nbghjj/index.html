<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ayat Bingo Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .header {
            width: 100%;
            max-width: 400px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1f1f1f;
            padding: 10px 15px;
            border-radius: 10px;
            margin-bottom: 15px;
            box-sizing: border-box;
        }
        .balance {
            color: #4CAF50;
            font-weight: bold;
        }
        .container {
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        #lobby-screen, #game-screen {
            display: none;
        }
        .active {
            display: block !important;
        }
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 15px;
        }
        .card-preview {
            background: #2b2b2b;
            padding: 15px;
            border-radius: 8px;
            cursor: pointer;
            border: 2px solid transparent;
            transition: 0.2s;
        }
        .card-preview.selected {
            border-color: #4CAF50;
            background: #1e3320;
        }
        .bingo-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 5px;
            margin-bottom: 15px;
        }
        .bingo-cell {
            background: #2b2b2b;
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            user-select: none;
        }
        .bingo-cell.marked {
            background: #4CAF50;
            color: white;
        }
        .btn {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }
        .btn:disabled {
            background: #555;
            cursor: not-allowed;
        }
        #timer-box {
            font-size: 18px;
            color: #ff9800;
            margin-bottom: 10px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="header">
        <div>አያት ቢንጎ</div>
        <div class="balance">ብር: <span id="user-balance">100</span></div>
    </div>

    <div class="container">
        <!-- 1. ሎቢ / ካርድ መምረጫ ስክሪን -->
        <div id="lobby-screen">
            <h3>ካርድ ይምረጡ (10 ብር)</h3>
            <div id="timer-box">ጨዋታው ሊጀምር ነው...</div>
            <div class="cards-grid" id="cards-container">
                <!-- በጃቫስክሪፕት ካርዶች ይሞላሉ -->
            </div>
            <button class="btn" id="lock-btn" onclick="lockSelectedCard()">ካርድ 🔒 (ቆልፍ)</button>
        </div>

        <!-- 2. ዋናው የቢንጎ መጫወቻ ስክሪን -->
        <div id="game-screen">
            <h2 id="game-status-text">ጨዋታ በመካሄድ ላይ...</h2>
            <div id="game-timer" style="color: #ff9800; margin-bottom: 10px;"></div>
            <div class="bingo-grid" id="bingo-board">
                <!-- የቢንጎ 5x5 ሰንጠረዥ -->
            </div>
            <button class="btn" style="background: #e91e63;" onclick="claimBingo()">🎉 BINGO! (አሸንፌአለሁ)</button>
        </div>
    </div>

    <script>
        // 1. ቋሚ ዩዘር መለያ (User ID) አያያዝ
        let telegramUser = localStorage.getItem("bingo_user_id");
        if (!telegramUser) {
            telegramUser = "user_" + Math.floor(Math.random() * 100000);
            localStorage.setItem("bingo_user_id", telegramUser);
        }

        let tg = window.Telegram ? window.Telegram.WebApp : null;
        if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) {
            telegramUser = tg.initDataUnsafe.user.id.toString();
        }

        let selectedCharAtLobby = null;
        let myCurrentCard = null;
        let currentBalance = 100;

        // የካርድ ምርጫዎች (በዴሞ 6 ካርዶች)
        const availableCards = [
            { id: "1", numbers: [5, 12, 23, 34, 45, 2, 14, 25, 36, 47, 8, 19, 0, 31, 42, 3, 11, 22, 33, 44, 1, 10, 20, 30, 40] },
            { id: "2", numbers: [7, 15, 24, 32, 41, 4, 16, 26, 35, 46, 9, 18, 0, 29, 39, 6, 13, 21, 37, 48, 2, 11, 22, 33, 44] },
            { id: "3", numbers: [1, 11, 21, 31, 41, 5, 15, 25, 35, 45, 9, 19, 0, 29, 39, 3, 13, 23, 33, 43, 7, 17, 27, 37, 47] },
            { id: "4", numbers: [10, 20, 30, 40, 50, 8, 18, 28, 38, 48, 6, 16, 0, 36, 46, 4, 14, 24, 34, 44, 2, 12, 22, 32, 42] },
            { id: "5", numbers: [3, 13, 23, 33, 43, 6, 16, 26, 36, 46, 9, 19, 0, 39, 49, 1, 11, 21, 31, 41, 7, 17, 27, 37, 47] },
            { id: "6", numbers: [12, 22, 32, 42, 52, 10, 20, 30, 40, 50, 5, 15, 0, 25, 35, 3, 13, 23, 33, 43, 1, 11, 21, 31, 41] }
        ];

        function initLobbyCards() {
            const container = document.getElementById('cards-container');
            container.innerHTML = '';
            availableCards.forEach(card => {
                let div = document.createElement('div');
                div.className = `card-preview ${myCurrentCard === card.id ? 'selected' : ''}`;
                div.innerHTML = `<b>ካርድ #${card.id}</b>`;
                div.onclick = () => selectCard(card.id);
                container.appendChild(div);
            });
        }

        function selectCard(cardId) {
            fetch('/api/lock_card', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ user_id: telegramUser, card_id: cardId })
            })
            .then(res => res.json())
            .then(data => {
                if(data.success) {
                    myCurrentCard = cardId;
                    currentBalance = data.new_balance;
                    document.getElementById('user-balance').innerText = currentBalance;
                    initLobbyCards();
                } else {
                    alert(data.message);
                }
            });
        }

        function lockSelectedCard() {
            if(!myCurrentCard) {
                alert("እባክዎ መጀመሪያ የሚያስፈልግዎትን ካርድ ይምረጡ!");
                return;
            }
            alert("ካርዱ ተይዟል! ጨዋታው እስኪጀምር ይጠብቁ...");
        }

        // ሰርቨሩን በየሰኮንዱ በመፈተሽ ስቴቱን መቀበል
        function pollGameState() {
            fetch('/api/get_state')
            .then(res => res.json())
            .then(data => {
                // የሂሳብ መጠንን ማዘመን
                updateBalance();

                const lobbyScreen = document.getElementById('lobby-screen');
                const gameScreen = document.getElementById('game-screen');

                if (data.status === "waiting" || data.status === "countdown") {
                    lobbyScreen.classList.add('active');
                    gameScreen.classList.remove('active');

                    if (data.status === "countdown") {
                        document.getElementById('timer-box').innerText = `ጨዋታው ሊጀምር ${data.timer} ሰኮንድ ይቀረዋል`;
                    } else {
                        document.getElementById('timer-box').innerText = "ተጫዋቾችን በመጠበቅ ላይ...";
                    }

                    // ማንም ካርድ ካልያዘ ራሱ ከሰርቨር ይመጣል
                    if(Object.keys(data.taken_cards).length === 0) {
                        myCurrentCard = null;
                    }
                    initLobbyCards();

                } else if (data.status === "playing") {
                    // የጨዋታ ሰዓት ሲደርስ ወደ መጫወቻው ስክሪን እንገባለን
                    if(!myCurrentCard) {
                        // ካርድ ሳይመርጥ ከቀረ ራንደም አንድ ካርድ እንሰጠዋለን ወይም ወደ ሎቢ እንመልሰዋለን
                        myCurrentCard = "1"; 
                    }
                    lobbyScreen.classList.remove('active');
                    gameScreen.classList.add('active');
                    document.getElementById('game-timer').innerText = `ቀሪ ሰዓት: ${data.timer} ሰኮንድ`;
                    renderGameTable();
                }
            });
        }

        function updateBalance() {
            fetch('/api/get_balance', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ user_id: telegramUser })
            })
            .then(res => res.json())
            .then(data => {
                if(data.success) {
                    document.getElementById('user-balance').innerText = data.balance;
                }
            });
        }

        function renderGameTable() {
            const board = document.getElementById('bingo-board');
            if(board.children.length > 0) return; // አስቀድሞ ከተሰራ አናድሰውም

            let cardData = availableCards.find(c => c.id === myCurrentCard) || availableCards[0];
            board.innerHTML = '';
            
            cardData.numbers.forEach((num, index) => {
                let cell = document.createElement('div');
                cell.className = 'bingo-cell';
                cell.innerText = num === 0 ? "★" : num;
                cell.onclick = () => {
                    cell.classList.toggle('marked');
                };
                board.appendChild(cell);
            });
        }

        function claimBingo() {
            fetch('/api/bingo_win', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ user_id: telegramUser })
            })
            .then(res => res.json())
            .then(data => {
                if(data.success) {
                    alert(data.message);
                    window.location.reload(); // ጨዋታው ሲጠናቀቅ አዲስ ዙር እንዲጀምር ሪፍሬሽ ይደረጋል
                } else {
                    alert("አሁንም ማረጋገጥ አልተቻለም!");
                }
            });
        }

        // በየሰኮንዱ ስቴቱን ማጣራት
        setInterval(pollGameState, 1000);
        updateBalance();
        initLobbyCards();
    </script>
</body>
</html>
