<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ayat Bingo - Mini App</title>
    <style>
        body {
            background-color: #120c24;
            color: #fff;
            font-family: sans-serif;
            margin: 0;
            padding: 10px;
        }

        .container {
            max-width: 480px;
            margin: 0 auto;
        }

        /* Home Screen Styles */
        .card-banner {
            background: linear-gradient(135deg, #2c1b4d, #1f143a);
            padding: 20px;
            border-radius: 14px;
            text-align: center;
            border: 1px solid #3c2a6d;
            margin-bottom: 15px;
        }

        .card-banner h3 {
            color: #f39c12;
            margin: 0 0 5px 0;
            font-size: 22px;
        }

        .card-banner p {
            color: #a08cc4;
            font-size: 13px;
            margin: 0 0 10px 0;
        }

        .card-banner span {
            background: #3c2a6d;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            color: #f1c40f;
        }

        .room-box {
            background: #1f143a;
            padding: 15px;
            border-radius: 14px;
            border: 1px solid #3c2a6d;
        }

        .room-info h4 {
            margin: 5px 0;
            font-size: 16px;
        }

        .stake-badge {
            background: #f39c12;
            color: #000;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
        }

        .join-btn, .start-game-btn, .bingo-claim-btn {
            background: linear-gradient(135deg, #f39c12, #f1c40f);
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            color: #000;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
            font-size: 15px;
        }

        .bingo-claim-btn {
            background: linear-gradient(135deg, #e74c3c, #c0392b);
            color: white;
        }

        /* Selection Screen Styles */
        .game-top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1f143a;
            padding: 10px;
            border-radius: 10px;
            margin-bottom: 10px;
            border: 1px solid #3c2a6d;
        }

        .leave-btn {
            background: #7928ca;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .stats-box {
            display: flex;
            gap: 4px;
        }

        .stats-box span {
            background: #2c1b4d;
            padding: 4px 6px;
            border-radius: 6px;
            font-size: 11px;
        }

        .selection-info {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: #a08cc4;
            margin-bottom: 8px;
            padding: 0 5px;
        }

        .cards-grid-container {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 5px;
            max-height: 200px;
            overflow-y: auto;
            background: #1f143a;
            padding: 10px;
            border-radius: 10px;
            border: 1px solid #3c2a6d;
        }

        .card-box {
            background: #3c2a6d;
            color: #fff;
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            border: none;
        }

        .card-box.selected {
            background: #f39c12;
            color: #000;
        }

        /* Live Game & Rendered Card Styles (እንደ ምስሉ የተዋቀረ) */
        .live-game-layout {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .called-number-display {
            background: #1f143a;
            border: 2px solid #f39c12;
            border-radius: 14px;
            text-align: center;
            padding: 15px;
        }

        .current-ball {
            font-size: 36px;
            font-weight: bold;
            color: #f39c12;
            margin: 5px 0;
        }

        /* የቢንጎ ካርድ ፕላስቲክ ዲዛይን */
        .rendered-bingo-card {
            background: #ffffff;
            color: #000;
            border-radius: 10px;
            padding: 10px;
            border: 3px solid #ff69b4; /* የሮዝ ከለር ሐንደበት ፍሬም */
            max-width: 340px;
            margin: 0 auto;
        }

        .bingo-header-row {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            background: #ff69b4;
            border-radius: 6px;
            padding: 6px 0;
            text-align: center;
            font-weight: bold;
            color: #fff;
            font-size: 18px;
            margin-bottom: 8px;
        }

        .bingo-grid-matrix {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 5px;
        }

        .bingo-cell {
            background: #fff;
            border: 2px solid #000;
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
        }

        .bingo-cell.free-cell {
            background: #ff69b4;
            color: #fff;
        }

        .bingo-cell.marked {
            background: #f39c12 !important;
            color: #000;
            text-decoration: line-through;
        }

        .card-footer-banner {
            margin-top: 8px;
            border-top: 2px solid #000;
            padding-top: 5px;
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- 1. HOME SCREEN -->
    <div id="home-screen" class="container">
        <div class="card-banner">
            <h3>AYAT BINGO</h3>
            <p>Complete simulated Bingo round.</p>
            <span>DEMO • 300 CARD CAPACITY</span>
        </div>
        
        <div class="room-box">
            <div class="room-info">
                <span class="stake-badge">20 BIRR</span>
                <h4>Ayat Bingo Room</h4>
                <p style="color: #a08cc4; font-size: 12px; margin: 2px 0;">• LIVE DEMO</p>
            </div>
            <p style="font-size: 13px; color: #a08cc4;">Players: <span id="player-count">59</span> / 300</p>
            <button id="joinRoomBtn" class="join-btn">JOIN ROOM →</button>
        </div>
    </div>

    <!-- 2. SELECTION SCREEN (ካርዶቹ የሚመረጡበት) -->
    <div id="selection-screen" class="container" style="display: none;">
        <div class="game-top-bar">
            <button id="leaveBtn" class="leave-btn">← Leave</button>
            <h3 style="margin: 0; font-size: 15px; color: #f39c12;">Ayat Bingo</h3>
            <div class="stats-box">
                <span>W: <b id="wallet-val">0</b></span>
                <span>S: <b id="stake-val">20</b></span>
                <span>WIN: <b id="win-val">0</b></span>
            </div>
        </div>

        <div class="selection-info">
            <span id="boards-count">Boards: 0/1</span>
            <span class="hint-text" style="color: #f1c40f;">Tap a card to join</span>
        </div>

        <div class="cards-grid-container" id="cardsGrid"></div>

        <button id="startGameBtn" class="start-game-btn" style="display: none;">START GAME</button>
    </div>

    <!-- 3. LIVE GAME & RENDERED CARD SCREEN (ተመርጦ የሚወጣው ካርድ እና ጨዋታ) -->
    <div id="live-game-screen" class="container" style="display: none;">
        <div class="game-top-bar">
            <h3 style="margin: 0; font-size: 14px; color: #f39c12;">Ayat Bingo - Live</h3>
            <button id="exitGameBtn" class="leave-btn">Exit</button>
        </div>

        <div class="live-game-layout">
            <div class="called-number-display">
                <p style="margin: 0; color: #a08cc4; font-size: 12px;">Current Called Number</p>
                <div id="currentBall" class="current-ball">--</div>
                <p id="callStatus" style="margin: 0; font-size: 11px; color: #f1c40f;">Game in progress...</p>
            </div>

            <!-- ልክ እንደ ላከው ምስል የተሰራ የቢንጎ ካርድ ማሳያ -->
            <div class="rendered-bingo-card">
                <div class="bingo-header-row">
                    <span>B</span><span>I</span><span>N</span><span>G</span><span>O</span>
                </div>
                <div id="bingoMatrixGrid" class="bingo-grid-matrix">
                    <!-- በጃቫስክሪፕት 5x5 ማትሪክስ ይሞላል -->
                </div>
                <div class="card-footer-banner">
                    <span style="color: #e74c3c;">ሲ.ቲ ቢንጎ</span>
                    <span id="cardNumLabel">የካርቴል ቁጥር --</span>
                </div>
            </div>

            <button id="bingoClaimBtn" class="bingo-claim-btn">BINGO!</button>
        </div>
    </div>

    <script>
        const totalBoards = 300;
        const maxSelection = 1; // ለአብነት 1 ካርድ እንዲመረጥ
        let selectedCards = [];
        let gameInterval = null;
        let currentCardData = null;
        let calledNumbersSet = new Set();

        const homeScreen = document.getElementById('home-screen');
        const selectionScreen = document.getElementById('selection-screen');
        const liveGameScreen = document.getElementById('live-game-screen');
        
        const joinRoomBtn = document.getElementById('joinRoomBtn');
        const leaveBtn = document.getElementById('leaveBtn');
        const startGameBtn = document.getElementById('startGameBtn');
        const exitGameBtn = document.getElementById('exitGameBtn');
        const bingoClaimBtn = document.getElementById('bingoClaimBtn');
        
        const gridContainer = document.getElementById('cardsGrid');
        const boardsCountText = document.getElementById('boards-count');
        const currentBall = document.getElementById('currentBall');
        const callStatus = document.getElementById('callStatus');
        const bingoMatrixGrid = document.getElementById('bingoMatrixGrid');
        const cardNumLabel = document.getElementById('cardNumLabel');

        // ካርድ ማመንጫ ሎጂክ (እንደ B-I-N-G-O ክልል)
        function generateCardData(cardId) {
            return {
                id: cardId,
                B: getRandomNumbers(1, 15, 5),
                I: getRandomNumbers(16, 30, 5),
                N: getRandomNumbers(31, 45, 4), // 4 numbers + 1 Free (F)
                G: getRandomNumbers(46, 60, 5),
                O: getRandomNumbers(61, 75, 5)
            };
        }

        function getRandomNumbers(min, max, count) {
            let nums = [];
            while(nums.length < count) {
                let r = Math.floor(Math.random() * (max - min + 1)) + min;
                if(!nums.includes(r)) nums.push(r);
            }
            return nums;
        }

        // 1-300 ካርዶችን በግሪድ መሙላት
        for (let i = 1; i <= totalBoards; i++) {
            const cardBtn = document.createElement('button');
            cardBtn.className = 'card-box';
            cardBtn.textContent = i;
            cardBtn.dataset.id = i;

            cardBtn.addEventListener('click', function() {
                const cardId = parseInt(this.dataset.id);
                if (selectedCards.includes(cardId)) {
                    selectedCards = selectedCards.filter(id => id !== cardId);
                    this.classList.remove('selected');
                } else {
                    if (selectedCards.length < maxSelection) {
                        selectedCards.push(cardId);
                        this.classList.add('selected');
                    } else {
                        alert(`እባክዎ ከ ${maxSelection} በላይ ካርድ መምረጥ አይችሉም!`);
                    }
                }
                boardsCountText.textContent = `Boards: ${selectedCards.length}/${maxSelection}`;
                startGameBtn.style.display = selectedCards.length > 0 ? 'block' : 'none';
            });
            gridContainer.appendChild(cardBtn);
        }

        joinRoomBtn.addEventListener('click', () => {
            homeScreen.style.display = 'none';
            selectionScreen.style.display = 'block';
        });

        leaveBtn.addEventListener('click', () => {
            selectionScreen.style.display = 'none';
            homeScreen.style.display = 'block';
        });

        // START GAME ሲጫን የተመረጠውን ካርድ ዲዛይን አድርጎ ማሳየት
        startGameBtn.addEventListener('click', () => {
            selectionScreen.style.display = 'none';
            liveGameScreen.style.display = 'block';
            
            const chosenId = selectedCards[0];
            currentCardData = generateCardData(chosenId);
            cardNumLabel.textContent = `የካርቴል ቁጥር ${chosenId}`;
            
            renderRenderedCard(currentCardData);
            startNumberCalling();
        });

        // ካርዱን 5x5 ማትሪክስ አድርጎ መሳል
        function renderRenderedCard(cardObj) {
            bingoMatrixGrid.innerHTML = '';
            // ረድፍ በረድፍ ማዋቀር (Row-wise order from B, I, N, G, O columns)
            let matrixValues = [
                [cardObj.B[0], cardObj.I[0], cardObj.N[0], cardObj.G[0], cardObj.O[0]],
                [cardObj.B[1], cardObj.I[1], cardObj.N[1], cardObj.G[1], cardObj.O[1]],
                [cardObj.B[2], cardObj.I[2], 'F',          cardObj.G[2], cardObj.O[2]],
                [cardObj.B[3], cardObj.I[3], cardObj.N[2], cardObj.G[3], cardObj.O[3]],
                [cardObj.B[4], cardObj.I[4], cardObj.N[3], cardObj.G[4], cardObj.O[4]]
            ];

            matrixValues.forEach((row, rIdx) => {
                row.forEach((val, cIdx) => {
                    const cell = document.createElement('div');
                    cell.className = 'bingo-cell';
                    if (val === 'F') {
                        cell.textContent = 'F';
                        cell.classList.add('free-cell', 'marked');
                        cell.dataset.marked = "true";
                    } else {
                        cell.textContent = val;
                        cell.dataset.value = val;
                        // ተጠቃሚው የጠራውን ቁጥር ነክቶ ማርክ እንዲያደርግበት
                        cell.addEventListener('click', function() {
                            if (calledNumbersSet.has(val)) {
                                this.classList.toggle('marked');
                            } else {
                                alert("ይህ ቁጥር ገና አልተጠራም!");
                            }
                        });
                    }
                    bingoMatrixGrid.appendChild(cell);
                });
            });
        }

        // ቁጥሮች ማስተላለፊያ ሎጂክ (1-75)
        function startNumberCalling() {
            calledNumbersSet.clear();
            let pool = Array.from({length: 75}, (_, i) => i + 1).sort(() => Math.random() - 0.5);
            let idx = 0;
            callStatus.textContent = "Game running...";

            gameInterval = setInterval(() => {
                if (idx < pool.length) {
                    let num = pool[idx];
                    calledNumbersSet.add(num);
                    currentBall.textContent = num;
                    idx++;
                } else {
                    clearInterval(gameInterval);
                    callStatus.textContent = "Round Ended!";
                }
            }, 3000);
        }

        // BINGO ቁልፍ ሲጫን የማሸነፍ ሁኔታን ማረጋገጥ
        bingoClaimBtn.addEventListener('click', () => {
            const cells = bingoMatrixGrid.querySelectorAll('.bingo-cell');
            let allMarked = true;
            cells.forEach(c => {
                if (!c.classList.contains('marked')) {
                    allMarked = false;
                }
            });

            if (allMarked) {
                alert("እንኳን ደስ አለዎት! BINGO አሸንፈዋል! 🎉");
            } else {
                alert("ገና አልተሞላም! ተጨማሪ ቁጥሮች ይጠብቁ ወይም ትክክለኛዎቹን ቁጥሮች ምልክት ያድርጉ።");
            }
        });

        exitGameBtn.addEventListener('click', () => {
            clearInterval(gameInterval);
            liveGameScreen.style.display = 'none';
            homeScreen.style.display = 'block';
            selectedCards = [];
            startGameBtn.style.display = 'none';
            currentBall.textContent = '--';
        });
    </script>
</body>
    </html>
