<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ሐራር Bingo - Mini App</title>
    <style>
        /* --- CSS STYLES --- */
        body {
            background-color: #120c24;
            color: #fff;
            font-family: sans-serif;
            margin: 0;
            padding: 10px;
        }

        .container {
            max-width: 480px;
            margin: 0 auto;
        }

        /* Home Screen Styles */
        .card-banner {
            background: linear-gradient(135deg, #2c1b4d, #1f143a);
            padding: 20px;
            border-radius: 14px;
            text-align: center;
            border: 1px solid #3c2a6d;
            margin-bottom: 15px;
        }

        .card-banner h3 {
            color: #f39c12;
            margin: 0 0 5px 0;
            font-size: 22px;
        }

        .card-banner p {
            color: #a08cc4;
            font-size: 13px;
            margin: 0 0 10px 0;
        }

        .card-banner span {
            background: #3c2a6d;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            color: #f1c40f;
        }

        .room-box {
            background: #1f143a;
            padding: 15px;
            border-radius: 14px;
            border: 1px solid #3c2a6d;
        }

        .room-info h4 {
            margin: 5px 0;
            font-size: 16px;
        }

        .stake-badge {
            background: #f39c12;
            color: #000;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
        }

        .join-btn {
            background: linear-gradient(135deg, #f39c12, #f1c40f);
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            color: #000;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
            font-size: 15px;
        }

        /* Game Screen Styles */
        .game-top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1f143a;
            padding: 10px;
            border-radius: 10px;
            margin-bottom: 10px;
            border: 1px solid #3c2a6d;
        }

        .leave-btn {
            background: #7928ca;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .stats-box {
            display: flex;
            gap: 4px;
        }

        .stats-box span {
            background: #2c1b4d;
            padding: 4px 6px;
            border-radius: 6px;
            font-size: 11px;
        }

        .selection-info {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: #a08cc4;
            margin-bottom: 8px;
            padding: 0 5px;
        }

        .cards-grid-container {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 5px;
            max-height: 260px;
            overflow-y: auto;
            background: #1f143a;
            padding: 10px;
            border-radius: 10px;
            border: 1px solid #3c2a6d;
        }

        .card-box {
            background: #3c2a6d;
            color: #fff;
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            border: none;
            transition: 0.1s;
        }

        .card-box:hover {
            background: #5d3fd3;
        }

        .card-box.selected {
            background: #f39c12;
            color: #000;
        }

        .bottom-msg {
            text-align: center;
            margin-top: 25px;
            color: #8c7aa9;
            font-size: 13px;
            background: #1f143a;
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #3c2a6d;
        }
    </style>
</head>
<body>

    <!-- 1. HOME SCREEN -->
    <div id="home-screen" class="container">
        <div class="card-banner">
            <h3>AYAT BINGO</h3>
            <p>Complete simulated Bingo round.</p>
            <span>DEMO • 300 CARD CAPACITY</span>
        </div>
        
        <div class="room-box">
            <div class="room-info">
                <span class="stake-badge">20 BIRR</span>
                <h4>ሐራር Bingo Room</h4>
                <p style="color: #a08cc4; font-size: 12px; margin: 2px 0;">• LIVE DEMO</p>
            </div>
            <p style="font-size: 13px; color: #a08cc4;">Players: <span id="player-count">59</span> / 300</p>
            <button id="joinRoomBtn" class="join-btn">JOIN ROOM →</button>
        </div>
    </div>

    <!-- 2. GAME SCREEN (ካርዶቹ የሚመረጡበት) -->
    <div id="game-screen" class="container" style="display: none;">
        <div class="game-top-bar">
            <button id="leaveBtn" class="leave-btn">← Leave</button>
            <h3 style="margin: 0; font-size: 15px; color: #f39c12;">ሐራር Bingo</h3>
            <div class="stats-box">
                <span>W: <b id="wallet-val">0</b></span>
                <span>S: <b id="stake-val">20</b></span>
                <span>WIN: <b id="win-val">0</b></span>
            </div>
        </div>

        <div class="selection-info">
            <span id="boards-count">Boards: 0/2</span>
            <span class="hint-text" style="color: #f1c40f;">Tap a card to join</span>
        </div>

        <!-- ከ 1 እስከ 300 ያሉት ካርዶች ግሪድ -->
        <div class="cards-grid-container" id="cardsGrid">
            <!-- በ JavaScript ይሞላል -->
        </div>

        <div class="bottom-msg">
            <p id="selected-cards-msg" style="margin: 0;">Your cards will show here</p>
        </div>
    </div>

    <script>
        // --- JAVASCRIPT LOGIC ---
        const totalBoards = 300;
        const maxSelection = 2; // ከፍተኛው የሚመረጡ ካርዶች ብዛት
        let selectedCards = [];

        const homeScreen = document.getElementById('home-screen');
        const gameScreen = document.getElementById('game-screen');
        const joinRoomBtn = document.getElementById('joinRoomBtn');
        const leaveBtn = document.getElementById('leaveBtn');
        const gridContainer = document.getElementById('cardsGrid');
        const boardsCountText = document.getElementById('boards-count');
        const msgText = document.getElementById('selected-cards-msg');

        // JOIN ROOM ሲጫን ወደ ጨዋታ ገጽ መሸጋገር
        joinRoomBtn.addEventListener('click', function() {
            homeScreen.style.display = 'none';
            gameScreen.style.display = 'block';
        });

        // LEAVE ሲጫን ወደ መጀመሪያው ገጽ መመለስ
        leaveBtn.addEventListener('click', function() {
            gameScreen.style.display = 'none';
            homeScreen.style.display = 'block';
        });

        // ከ 1 እስከ 300 ያሉትን ካርዶች በግሪዱ ውስጥ መፍጠር
        for (let i = 1; i <= totalBoards; i++) {
            const cardBtn = document.createElement('button');
            cardBtn.className = 'card-box';
            cardBtn.textContent = i;
            cardBtn.dataset.id = i;

            // ካርዱ ሲነካ (Tap) የሚሰራ ሎጂክ
            cardBtn.addEventListener('click', function() {
                const cardId = parseInt(this.dataset.id);

                if (selectedCards.includes(cardId)) {
                    // ከተመረጠ ማጥፋት (Deselect)
                    selectedCards = selectedCards.filter(id => id !== cardId);
                    this.classList.remove('selected');
                } else {
                    // ገና ካልተመረጠ እና ገደቡ ካላለፈ መምረጥ
                    if (selectedCards.length < maxSelection) {
                        selectedCards.push(cardId);
                        this.classList.add('selected');
                    } else {
                        alert(`እባክዎ ከ ${maxSelection} በላይ ካርዶች መምረጥ አይችሉም!`);
                    }
                }

                // ዩአዩን (UI) ማዘመን
                boardsCountText.textContent = `Boards: ${selectedCards.length}/${maxSelection}`;
                if (selectedCards.length > 0) {
                    msgText.textContent = `Selected Cards: ${selectedCards.join(', ')}`;
                } else {
                    msgText.textContent = `Your cards will show here`;
                }
            });

            gridContainer.appendChild(cardBtn);
        }
    </script>
</body>
  </html>
