<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ayat Bingo - Mini App</title>
    <style>
        body {
            background-color: #120c24;
            color: #fff;
            font-family: sans-serif;
            margin: 0;
            padding: 10px;
        }

        .container {
            max-width: 480px;
            margin: 0 auto;
        }

        /* Home Screen Styles */
        .card-banner {
            background: linear-gradient(135deg, #2c1b4d, #1f143a);
            padding: 20px;
            border-radius: 14px;
            text-align: center;
            border: 1px solid #3c2a6d;
            margin-bottom: 15px;
        }

        .card-banner h3 {
            color: #f39c12;
            margin: 0 0 5px 0;
            font-size: 22px;
        }

        .card-banner p {
            color: #a08cc4;
            font-size: 13px;
            margin: 0 0 10px 0;
        }

        .card-banner span {
            background: #3c2a6d;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            color: #f1c40f;
        }

        .room-box {
            background: #1f143a;
            padding: 15px;
            border-radius: 14px;
            border: 1px solid #3c2a6d;
        }

        .room-info h4 {
            margin: 5px 0;
            font-size: 16px;
        }

        .stake-badge {
            background: #f39c12;
            color: #000;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
        }

        .join-btn {
            background: linear-gradient(135deg, #f39c12, #f1c40f);
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            color: #000;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
            font-size: 15px;
        }

        /* Selection Screen Styles */
        .game-top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1f143a;
            padding: 10px;
            border-radius: 10px;
            margin-bottom: 10px;
            border: 1px solid #3c2a6d;
        }

        .leave-btn {
            background: #7928ca;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .stats-box {
            display: flex;
            gap: 4px;
        }

        .stats-box span {
            background: #2c1b4d;
            padding: 4px 6px;
            border-radius: 6px;
            font-size: 11px;
        }

        .selection-info {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: #a08cc4;
            margin-bottom: 8px;
            padding: 0 5px;
        }

        .cards-grid-container {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 5px;
            max-height: 220px;
            overflow-y: auto;
            background: #1f143a;
            padding: 10px;
            border-radius: 10px;
            border: 1px solid #3c2a6d;
        }

        .card-box {
            background: #3c2a6d;
            color: #fff;
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            border: none;
        }

        .card-box.selected {
            background: #f39c12;
            color: #000;
        }

        .start-game-btn {
            background: linear-gradient(135deg, #27ae60, #2ecc71);
            color: white;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
            font-size: 15px;
        }

        /* Live Calling Game Screen Styles */
        .called-number-display {
            background: #1f143a;
            border: 2px solid #f39c12;
            border-radius: 14px;
            text-align: center;
            padding: 20px;
            margin-bottom: 15px;
        }

        .current-ball {
            font-size: 48px;
            font-weight: bold;
            color: #f39c12;
            margin: 10px 0;
        }

        .number-board-grid {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 4px;
            background: #1f143a;
            padding: 10px;
            border-radius: 10px;
            border: 1px solid #3c2a6d;
            max-height: 250px;
            overflow-y: auto;
        }

        .num-cell {
            background: #2c1b4d;
            color: #a08cc4;
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            border-radius: 4px;
        }

        .num-cell.called {
            background: #f39c12;
            color: #000;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- 1. HOME SCREEN -->
    <div id="home-screen" class="container">
        <div class="card-banner">
            <h3>AYAT BINGO</h3>
            <p>Complete simulated Bingo round.</p>
            <span>DEMO • 300 CARD CAPACITY</span>
        </div>
        
        <div class="room-box">
            <div class="room-info">
                <span class="stake-badge">20 BIRR</span>
                <h4>Ayat Bingo Room</h4>
                <p style="color: #a08cc4; font-size: 12px; margin: 2px 0;">• LIVE DEMO</p>
            </div>
            <p style="font-size: 13px; color: #a08cc4;">Players: <span id="player-count">59</span> / 300</p>
            <button id="joinRoomBtn" class="join-btn">JOIN ROOM →</button>
        </div>
    </div>

    <!-- 2. SELECTION SCREEN (ካርዶቹ የሚመረጡበት) -->
    <div id="selection-screen" class="container" style="display: none;">
        <div class="game-top-bar">
            <button id="leaveBtn" class="leave-btn">← Leave</button>
            <h3 style="margin: 0; font-size: 15px; color: #f39c12;">Ayat Bingo</h3>
            <div class="stats-box">
                <span>W: <b id="wallet-val">0</b></span>
                <span>S: <b id="stake-val">20</b></span>
                <span>WIN: <b id="win-val">0</b></span>
            </div>
        </div>

        <div class="selection-info">
            <span id="boards-count">Boards: 0/2</span>
            <span class="hint-text" style="color: #f1c40f;">Tap a card to join</span>
        </div>

        <div class="cards-grid-container" id="cardsGrid"></div>

        <button id="startGameBtn" class="start-game-btn" style="display: none;">START GAME</button>
    </div>

    <!-- 3. LIVE CALLING GAME SCREEN (ቁጥሮች ከ 1-75 የሚጠሩበት) -->
    <div id="live-game-screen" class="container" style="display: none;">
        <div class="game-top-bar">
            <h3 style="margin: 0; font-size: 15px; color: #f39c12;">Ayat Bingo - Live Call</h3>
            <button id="exitGameBtn" class="leave-btn">Exit</button>
        </div>

        <div class="called-number-display">
            <p style="margin: 0; color: #a08cc4; font-size: 13px;">Current Called Number</p>
            <div id="currentBall" class="current-ball">--</div>
            <p id="callStatus" style="margin: 0; font-size: 12px; color: #f1c40f;">Game starting...</p>
        </div>

        <p style="font-size: 13px; color: #a08cc4; margin-bottom: 5px;">Called Numbers Board (1 - 75):</p>
        <div class="number-board-grid" id="numberBoardGrid"></div>
    </div>

    <script>
        const totalBoards = 300;
        const maxSelection = 2;
        let selectedCards = [];
        let calledNumbers = [];
        let gameInterval = null;

        const homeScreen = document.getElementById('home-screen');
        const selectionScreen = document.getElementById('selection-screen');
        const liveGameScreen = document.getElementById('live-game-screen');
        
        const joinRoomBtn = document.getElementById('joinRoomBtn');
        const leaveBtn = document.getElementById('leaveBtn');
        const startGameBtn = document.getElementById('startGameBtn');
        const exitGameBtn = document.getElementById('exitGameBtn');
        
        const gridContainer = document.getElementById('cardsGrid');
        const boardsCountText = document.getElementById('boards-count');
        const numberBoardGrid = document.getElementById('numberBoardGrid');
        const currentBall = document.getElementById('currentBall');
        const callStatus = document.getElementById('callStatus');

        // 1. Join Room ሲጫን ወደ ካርድ ምርጫ መምጣት
        joinRoomBtn.addEventListener('click', function() {
            homeScreen.style.display = 'none';
            selectionScreen.style.display = 'block';
        });

        // 2. Leave ሲጫን ወደ መጀመሪያው መመለስ
        leaveBtn.addEventListener('click', function() {
            selectionScreen.style.display = 'none';
            homeScreen.style.display = 'block';
        });

        // ካርዶቹን ከ 1 እስከ 300 መፍጠር
        for (let i = 1; i <= totalBoards; i++) {
            const cardBtn = document.createElement('button');
            cardBtn.className = 'card-box';
            cardBtn.textContent = i;
            cardBtn.dataset.id = i;

            cardBtn.addEventListener('click', function() {
                const cardId = parseInt(this.dataset.id);

                if (selectedCards.includes(cardId)) {
                    selectedCards = selectedCards.filter(id => id !== cardId);
                    this.classList.remove('selected');
                } else {
                    if (selectedCards.length < maxSelection) {
                        selectedCards.push(cardId);
                        this.classList.add('selected');
                    } else {
                        alert(`እባክዎ ከ ${maxSelection} በላይ ካርዶች መምረጥ አይችሉም!`);
                    }
                }

                boardsCountText.textContent = `Boards: ${selectedCards.length}/${maxSelection}`;
                
                // ካርድ ሲመረጥ የ START ጨዋታ ቁልፍ እንዲታይ ማድረግ
                if (selectedCards.length > 0) {
                    startGameBtn.style.display = 'block';
                } else {
                    startGameBtn.style.display = 'none';
                }
            });

            gridContainer.appendChild(cardBtn);
        }

        // ከ 1 እስከ 75 ያሉትን የቁጥር ሰሌዳ በጨዋታ ማያ ገጽ ላይ ማዘጋጀት
        for (let i = 1; i <= 75; i++) {
            const numCell = document.createElement('div');
            numCell.className = 'num-cell';
            numCell.textContent = i;
            numCell.id = `num-cell-${i}`;
            numberBoardGrid.appendChild(numCell);
        }

        // 3. START GAME ሲጫን ወደ ተጠሪ ቁጥሮች ጨዋታ ገጽ መሸጋገር
        startGameBtn.addEventListener('click', function() {
            selectionScreen.style.display = 'none';
            liveGameScreen.style.display = 'block';
            startNumberCalling();
        });

        // 4. ከ 1 እስከ 75 ቁጥሮች በቅደም ተከተል ወይም በዘፈቀደ በሰዓት ልዩነት የሚጠሩበት ሎጂክ
        function startNumberCalling() {
            calledNumbers = [];
            // ከ 1 እስከ 75 ያሉትን ቁጥሮች ማዘጋጀትና መቀላቀል (Shuffle)
            let numbersPool = Array.from({length: 75}, (_, index) => index + 1);
            numbersPool.sort(() => Math.random() - 0.5);

            let index = 0;
            callStatus.textContent = "Game in progress...";

            gameInterval = setInterval(() => {
                if (index < numbersPool.length) {
                    let num = numbersPool[index];
                    calledNumbers.push(num);
                    currentBall.textContent = num;

                    // የተጠራውን ቁጥር በሰሌዳው ላይ ማደምቀቅ (Highlight)
                    const cell = document.getElementById(`num-cell-${num}`);
                    if (cell) {
                        cell.classList.add('called');
                    }

                    index++;
                } else {
                    clearInterval(gameInterval);
                    callStatus.textContent = "Game Over!";
                }
            }, 3000); // በየ 3 ሰከንዱ አንድ ቁጥር ይጠራል
        }

        // ከጨዋታው መውጫ
        exitGameBtn.addEventListener('click', function() {
            clearInterval(gameInterval);
            liveGameScreen.style.display = 'none';
            homeScreen.style.display = 'block';
            // ሪሴት ማድረግ ከፈለጉ
            selectedCards = [];
            startGameBtn.style.display = 'none';
            document.querySelectorAll('.card-box.selected').forEach(el => el.classList.remove('selected'));
            document.querySelectorAll('.num-cell.called').forEach(el => el.classList.remove('called'));
            currentBall.textContent = '--';
        });
    </script>
</body>
    </html>
