<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ayat Bingo</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background: #f4f4f9; margin: 0; padding: 20px; }
        .hidden { display: none !important; }
        #game-screen, #selection-screen { max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .card-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; margin: 20px 0; }
        .bingo-cell { padding: 10px; background: #e0e0e0; border-radius: 4px; font-weight: bold; cursor: pointer; }
        .bingo-cell.marked { background: #4caf50; color: white; }
        .btn { padding: 10px 20px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; }
        .btn:hover { background: #0056b3; }
        .btn-danger { background: #dc3545; }
        .btn-danger:hover { background: #a71d2a; }
    </style>
</head>
<body>

    <!-- የካርድ መረጣ ስክሪን -->
    <div id="selection-screen">
        <h2>Ayat Bingo - ካርድ ይምረጡ</h2>
        <p>ሂሳብዎ: <span id="user-balance">100</span> ብር</p>
        <p>ካርድ ቁጥር 1 ይምረጡ (የስታክ ዋጋ: 10 ብር)</p>
        <button class="btn" onclick="lockCard('1')">ካርድ 1 ያዙ እና ይጫወቱ</button>
    </div>

    <!-- የጨዋታ ስክሪን -->
    <div id="game-screen" class="hidden">
        <h2>Ayat Bingo ጨዋታ</h2>
        <p>ሁኔታ: <span id="game-status-text">በመጠበቅ ላይ...</span></p>
        <p>ቀሪ ሰዓት: <span id="timer-text">45</span> ሰከንድ</p>
        <h3>የተጠራው ቁጥር: <span id="called-number" style="color: red; font-size: 24px;">-</span></h3>
        
        <div id="card-display" class="card-grid">
            <!-- የካርዱ ሕዋሶች እዚህ ይገባሉ -->
        </div>

        <button class="btn btn-danger" onclick="handleExitGame()">Exit (ውጣ)</button>
        <button class="btn" onclick="callBingo()" style="background: #28a745; margin-left: 10px;">BINGO! (ቢንጎ!)</button>
    </div>

    <script>
        const userId = "user_" + Math.floor(Math.random() * 1000);
        let selectedCharAtId = null;
        let currentGameStatus = "waiting";

        // የሂሳብ መጠን ማስተካከያ
        function fetchBalance() {
            fetch('/api/get_balance', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ user_id: userId })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    document.getElementById('user-balance').innerText = data.balance;
                }
            });
        }

        // ካርድ መያዣ
        function lockCard(cardId) {
            fetch('/api/lock_card', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ user_id: userId, card_id: cardId })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    selectedCharAtId = cardId;
                    document.getElementById('user-balance').innerText = data.new_balance;
                    document.getElementById('selection-screen').classList.add('hidden');
                    document.getElementById('game-screen').classList.remove('hidden');
                } else {
                    alert(data.message);
                }
            });
        }

        // የ Exit ቁልፍ ሲጫን የሚሰራው ትክክለኛ ሎጂክ
        function handleExitGame() {
            if (currentGameStatus === 'playing') {
                // ጨዋታው ከተጀመረ (playing ከሆነ) ሰርቨር ላይ ካርዱ ሳይለቀቅ ወደ መረጣ ስክሪን ይመለሳል
                alert("ጨዋታው በሂደት ላይ ስለሆነ ካርዱ ተይዞ ይቀጥላል፤ ወደ ካርድ መረጣው ተመልሰዋል።");
                document.getElementById('game-screen').classList.add('hidden');
                document.getElementById('selection-screen').classList.remove('hidden');
            } else if (currentGameStatus === 'countdown') {
                // ቆጠራ ላይ (countdown) ከሆነ ደግሞ ሰርቨር በመሄድ ካርዱን ለቆ ገንዘቡን ተመላሽ ያደርጋል
                fetch('/api/unlock_card', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: userId, card_id: selectedCharAtId })
                })
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        document.getElementById('user-balance').innerText = data.new_balance;
                        selectedCharAtId = null;
                        document.getElementById('game-screen').classList.add('hidden');
                        document.getElementById('selection-screen').classList.remove('hidden');
                    } else {
                        alert(data.message);
                    }
                });
            } else {
                // waiting ከሆነ በቀጥታ ይመለሳል
                document.getElementById('game-screen').classList.add('hidden');
                document.getElementById('selection-screen').classList.remove('hidden');
            }
        }

        // ቢንጎ ለማለት
        function callBingo() {
            fetch('/api/bingo_win', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ user_id: userId, card_id: selectedCharAtId })
            })
            .then(res => res.json())
            .then(data => {
                alert(data.message);
                if (data.success) {
                    document.getElementById('user-balance').innerText = data.new_balance;
                    document.getElementById('game-screen').classList.add('hidden');
                    document.getElementById('selection-screen').classList.remove('hidden');
                }
            });
        }

        // የሰርቨር ስቴት መቆጣጠሪያ ፖሊንግ (Polling)
        setInterval(() => {
            fetch('/api/get_state')
            .then(res => res.json())
            .then(data => {
                currentGameStatus = data.status;
                document.getElementById('game-status-text').innerText = data.status;
                document.getElementById('timer-text').innerText = data.timer;
                document.getElementById('called-number').innerText = data.current_called_number || "-";

                // ጨዋታው ካለቀ ራሱ ወደ መረጣ ስክሪን ይመልሰዋል
                if (data.status === "waiting" && document.getElementById('game-screen').classList.contains('hidden') === false) {
                    // ከተፈለገ ጨዋታው ሲያልቅ ማሳየት ይቻላል
                }
            });
        }, 1000);

        fetchBalance();
    </script>
</body>
</html>
