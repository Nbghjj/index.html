<!DOCTYPE html>
<html lang="am">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>AYAT BINGO — Real Money</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;padding:12px;background:#120c24;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.container{max-width:480px;margin:auto}
.screen{display:none}.screen.active{display:block}
.panel{background:#1f143a;border:1px solid #3c2a6d;border-radius:14px;padding:16px;margin-bottom:12px}
.hero{text-align:center;background:linear-gradient(135deg,#2c1b4d,#1f143a)}
.hero h1{margin:4px 0;color:#f39c12;font-size:28px}.muted{color:#a08cc4;font-size:13px}
.badge{display:inline-block;background:#27ae60;color:#fff;padding:5px 10px;border-radius:20px;font-size:11px}
.btn{width:100%;border:0;border-radius:9px;padding:14px;font-weight:700;font-size:15px;cursor:pointer;margin-top:8px}
.primary{background:linear-gradient(135deg,#f39c12,#f1c40f);color:#111}
.green{background:#27ae60;color:#fff}.dark{background:#3c2a6d;color:#fff}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.cards{display:grid;grid-template-columns:repeat(10,1fr);gap:5px;max-height:330px;overflow:auto;padding:8px;background:#1f143a;border:1px solid #3c2a6d;border-radius:10px}
.card{aspect-ratio:1;border:1px solid #523a8a;border-radius:5px;background:#3c2a6d;color:#fff;font-weight:700;cursor:pointer}
.card.selected{background:#f39c12;color:#111}
.bingo{background:#fff;color:#000;border:3px solid #ff69b4;border-radius:12px;padding:9px;max-width:350px;margin:0 auto}
.head{display:grid;grid-template-columns:repeat(5,1fr);background:#ff69b4;color:#fff;border-radius:6px;padding:6px;text-align:center;font-weight:800}
.matrix{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-top:7px}
.cell{aspect-ratio:1;border:2px solid #000;border-radius:4px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;cursor:pointer}
.cell.marked{background:#f39c12}
.ball{text-align:center;border:2px solid #f39c12;border-radius:14px;padding:12px;margin-bottom:12px}
.ballnum{font-size:40px;font-weight:900;color:#f39c12}
.access{max-width:460px;margin:60px auto;text-align:center;padding:25px;background:#1f143a;border:1px solid #e74c3c;border-radius:14px}
</style>
</head>
<body>

<div id="access" class="access" style="display:none">
  <h2>⚠️ Telegram ውስጥ ይክፈቱ</h2>
  <p class="muted">ይህ Mini App ከTelegram Bot ውስጥ ብቻ ይሰራል::</p>
</div>

<main id="app" class="container">
  <section id="home" class="screen active">
    <div class="panel hero">
      <h1>AYAT BINGO</h1>
      <p class="muted">የእውነተኛ ብር ቢንጎ ጨዋታ</p>
      <span class="badge">REAL MONEY GAME</span>
    </div>
    
    <div class="panel">
      <div class="top">
        <span class="muted">የእርስዎ ባላንስ:</span>
        <strong id="balance">0.00 ETB</strong>
      </div>
      <button id="depositBtn" class="btn green">ብር አስገባ (Deposit)</button>
      <button id="withdrawBtn" class="btn dark">ብር አውጣ (Withdraw)</button>
    </div>

    <div class="panel">
      <div class="top">
        <div><b>Ayat Bingo Room</b><div class="muted">መግቢያ: 20 ETB</div></div>
      </div>
      <button id="joinBtn" class="btn primary">ጨዋታ ጀምር (JOIN ROOM)</button>
    </div>
  </section>

  <section id="select" class="screen">
    <div class="panel">
      <b>ካርድ ይምረጡ</b>
      <div id="cards" class="cards"></div>
      <button id="startBtn" class="btn primary" disabled>ካርድ አረጋግጥ</button>
    </div>
  </section>

  <section id="game" class="screen">
    <div class="ball">
      <div class="muted">የተጠራው ቁጥር</div>
      <div id="ball" class="ballnum">--</div>
    </div>
    <div class="bingo">
      <div class="head"><span>B</span><span>I</span><span>N</span><span>G</span><span>O</span></div>
      <div id="matrix" class="matrix"></div>
    </div>
    <button id="claimBtn" class="btn green">BINGO! 🎉</button>
  </section>
</main>

<script>
(() => {
  "use strict";
  const BACKEND_URL = "https://your-backend-api.com"; // የሰርቨርህ አድራሻ
  const tg = window.Telegram?.WebApp;
  
  if(!tg?.initDataUnsafe?.user?.id){
    document.getElementById("app").style.display="none";
    document.getElementById("access").style.display="block";
    return;
  }
  tg.ready(); tg.expand();

  const user = tg.initDataUnsafe.user;
  let selectedCard = null;

  // 1. የይዘት/የባላንስ መረጃ ከሰርቨር ማምጫ
  async function fetchUserData() {
    try {
      const res = await fetch(`${BACKEND_URL}/api/user/${user.id}`, {
        headers: { 'Authorization': tg.initData }
      });
      const data = await res.json();
      document.getElementById("balance").textContent = `${data.balance} ETB`;
    } catch(e) {
      console.error("Backend connection error", e);
    }
  }

  // 2. Deposit (Telebirr/Chapa) ጥያቄ ለሰርቨር መላክ
  document.getElementById("depositBtn").onclick = async () => {
    const amount = prompt("ምንያህል ማስገባት ይፈልጋሉ (ETB)?", "100");
    if(!amount) return;

    const res = await fetch(`${BACKEND_URL}/api/pay/deposit`, {
      method: "POST",
      headers: { "Content-Type": "application/json", 'Authorization': tg.initData },
      body: JSON.stringify({ userId: user.id, amount: Number(amount) })
    });
    const data = await res.json();
    if(data.checkoutUrl) {
      tg.openInvoice(data.checkoutUrl); // ወይም Telegram Payment URL
    }
  };

  // 3. ጨዋታ መቀላቀል
  document.getElementById("joinBtn").onclick = () => {
    showScreen("select");
    buildCards();
  };

  function showScreen(id) {
    document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
    document.getElementById(id).classList.add("active");
  }

  function buildCards() {
    const box = document.getElementById("cards");
    box.innerHTML = "";
    for(let i=1; i<=300; i++){
      const b = document.createElement("button");
      b.className = "card";
      b.textContent = i;
      b.onclick = () => {
        selectedCard = i;
        document.querySelectorAll(".card").forEach(c => c.classList.remove("selected"));
        b.classList.add("selected");
        document.getElementById("startBtn").disabled = false;
      };
      box.appendChild(b);
    }
  }

  fetchUserData();
})();
</script>
</body>
</html>
