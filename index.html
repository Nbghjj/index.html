<!DOCTYPE html>
<html lang="am">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>AYAT BINGO — Real Money</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;padding:12px;background:#120c24;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.container{max-width:480px;margin:auto}

/* CSS Fix: ስክሪኖች እንዲታዩና እንዲሰወሩ የተደረገ ማስተካከያ */
.screen{display:none}
.screen.active{display:block !important}

.panel{background:#1f143a;border:1px solid #3c2a6d;border-radius:14px;padding:16px;margin-bottom:12px}
.hero{text-align:center;background:linear-gradient(135deg,#2c1b4d,#1f143a)}
.hero h1{margin:4px 0;color:#f39c12;font-size:28px}.muted{color:#a08cc4;font-size:13px}
.badge{display:inline-block;background:#27ae60;color:#fff;padding:5px 10px;border-radius:20px;font-size:11px}
.btn{width:100%;border:0;border-radius:9px;padding:14px;font-weight:700;font-size:15px;cursor:pointer;margin-top:8px}
.btn:disabled{opacity:0.5;cursor:not-allowed}
.primary{background:linear-gradient(135deg,#f39c12,#f1c40f);color:#111}
.green{background:#27ae60;color:#fff}.dark{background:#3c2a6d;color:#fff}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.input{width:100%;padding:12px;margin:6px 0 12px;border-radius:8px;border:1px solid #4b377d;background:#120c24;color:#fff;font-size:14px}
.bank-info{background:#2c1b4d;padding:10px;border-radius:8px;margin-bottom:12px;border-left:4px solid #f39c12}
.smallbtn{border:0;border-radius:7px;padding:8px 11px;background:#7928ca;color:#fff;font-weight:700;cursor:pointer}

/* የካርድ መምረጫ Grid */
.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;max-height:300px;overflow-y:auto;padding:8px;background:#120c24;border:1px solid #3c2a6d;border-radius:10px}
.card-item{aspect-ratio:1;border:1px solid #523a8a;border-radius:6px;background:#3c2a6d;color:#fff;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center}
.card-item.selected{background:#f39c12;color:#111;border-color:#fff}

/* የቢንጎ ሰሌዳ */
.bingo{background:#fff;color:#000;border:3px solid #ff69b4;border-radius:12px;padding:9px;max-width:350px;margin:0 auto}
.head{display:grid;grid-template-columns:repeat(5,1fr);background:#ff69b4;color:#fff;border-radius:6px;padding:6px;text-align:center;font-weight:800}
.matrix{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-top:7px}
.cell{aspect-ratio:1;border:2px solid #000;border-radius:4px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;cursor:pointer}
.cell.marked{background:#f39c12;color:#fff}
.ball{text-align:center;border:2px solid #f39c12;border-radius:14px;padding:12px;margin-bottom:12px}
.ballnum{font-size:36px;font-weight:900;color:#f39c12}
</style>
</head>
<body>

<main id="app" class="container">
  <!-- 1. HOME SCREEN -->
  <section id="home" class="screen active">
    <div class="panel hero">
      <h1>AYAT BINGO</h1>
      <p class="muted">የእውነተኛ ብር ቢንጎ ጨዋታ</p>
      <span class="badge">REAL MONEY GAME</span>
    </div>
    
    <div class="panel">
      <div class="top">
        <span class="muted">የእርስዎ ባላንስ:</span>
        <strong id="balance">100.00 ETB</strong>
      </div>
      <button id="goDeposit" class="btn green">ብር አስገባ (Deposit)</button>
      <button id="goWithdraw" class="btn dark">ብር አውጣ (Withdraw)</button>
    </div>

    <div class="panel">
      <div class="top">
        <div><b>Ayat Bingo Room</b><div class="muted">መግቢያ: 20 ETB</div></div>
      </div>
      <button id="joinBtn" class="btn primary">ጨዋታ ጀምር (JOIN ROOM)</button>
    </div>
  </section>

  <!-- 2. CARD SELECT SCREEN -->
  <section id="select" class="screen">
    <div class="panel">
      <div class="top">
        <button class="smallbtn backHome">← ተመለስ</button>
        <b>ካርድ ይምረጡ</b>
      </div>
      <p class="muted">ለመጫወት የሚፈልጉትን የካርድ ቁጥር ይምረጡ (1-300)</p>
      <div id="cardsList" class="cards"></div>
      <button id="startBtn" class="btn primary" disabled>ጨዋታውን ጀምር</button>
    </div>
  </section>

  <!-- 3. GAME PLAY SCREEN -->
  <section id="game" class="screen">
    <div class="panel">
      <div class="top">
        <b>AYAT BINGO — LIVE</b>
        <button class="smallbtn backHome">ውጣ</button>
      </div>
      <div class="ball">
        <div class="muted">የተጠራው ቁጥር</div>
        <div id="ball" class="ballnum">--</div>
      </div>
      <div class="bingo">
        <div class="head"><span>B</span><span>I</span><span>N</span><span>G</span><span>O</span></div>
        <div id="matrix" class="matrix"></div>
      </div>
      <button id="claimBtn" class="btn green" style="margin-top:12px;">BINGO! 🎉</button>
    </div>
  </section>

  <!-- 4. DEPOSIT SCREEN -->
  <section id="deposit" class="screen">
    <div class="panel">
      <div class="top"><button class="smallbtn backHome">← ተመለስ</button><b>ብር ማስገቢያ</b></div>
      <div class="bank-info">
        <div><b>CBE:</b> 1000123456789</div>
        <div><b>Telebirr:</b> 0911000000</div>
      </div>
      <label class="muted">የያስገቡት መጠን (ETB)</label>
      <input id="depAmount" type="number" class="input" placeholder="200">
      <label class="muted">Transaction Reference No.</label>
      <input id="depRef" type="text" class="input" placeholder="FT24XXXXXX">
      <button id="submitDeposit" class="btn green">ጥያቄውን ላክ</button>
    </div>
  </section>

  <!-- 5. WITHDRAW SCREEN -->
  <section id="withdraw" class="screen">
    <div class="panel">
      <div class="top"><button class="smallbtn backHome">← ተመለስ</button><b>ብር ማውጫ</b></div>
      <label class="muted">የባንክ / ቴሌብር ቁጥር</label>
      <input type="text" class="input" placeholder="የባንክ ሂሳብ ቁጥር">
      <label class="muted">የመጠኑ ብዛት (ETB)</label>
      <input type="number" class="input" placeholder="500">
      <button id="submitWithdraw" class="btn dark">የማውጣት ጥያቄ ላክ</button>
    </div>
  </section>
</main>

<script>
(() => {
  "use strict";
  const tg = window.Telegram?.WebApp;
  tg?.ready(); tg?.expand();

  let selectedCard = null;

  // የስክሪን መለወጫ Function
  function showScreen(id) {
    document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
    const target = document.getElementById(id);
    if(target) target.classList.add("active");
  }

  // 1. JOIN ROOM አዝራር ሲነካ
  document.getElementById("joinBtn").onclick = () => {
    showScreen("select");
    buildCards();
  };

  // 2. 300 የቢንጎ ካርዶችን መፍጠሪያ
  function buildCards() {
    const box = document.getElementById("cardsList");
    box.innerHTML = "";
    for(let i = 1; i <= 300; i++) {
      const b = document.createElement("div");
      b.className = "card-item";
      b.textContent = `#${i}`;
      b.onclick = () => {
        selectedCard = i;
        document.querySelectorAll(".card-item").forEach(c => c.classList.remove("selected"));
        b.classList.add("selected");
        document.getElementById("startBtn").disabled = false;
      };
      box.appendChild(b);
    }
  }

  // 3. START GAME - ጨዋታውን መጀመር
  document.getElementById("startBtn").onclick = () => {
    showScreen("game");
    renderBoard();
  };

  // 4. የቢንጎ ሰሌዳ መሳያ
  function renderBoard() {
    const matrix = document.getElementById("matrix");
    matrix.innerHTML = "";
    for(let i = 0; i < 25; i++) {
      const cell = document.createElement("div");
      cell.className = "cell";
      if(i === 12) {
        cell.textContent = "FREE";
        cell.classList.add("marked");
      } else {
        cell.textContent = Math.floor(Math.random() * 75) + 1;
        cell.onclick = () => cell.classList.toggle("marked");
      }
      matrix.appendChild(cell);
    }
  }

  // Navigation Event Listeners
  document.getElementById("goDeposit").onclick = () => showScreen("deposit");
  document.getElementById("goWithdraw").onclick = () => showScreen("withdraw");
  document.querySelectorAll(".backHome").forEach(b => b.onclick = () => showScreen("home"));

  document.getElementById("submitDeposit").onclick = () => {
    alert("የDeposit ጥያቄዎ ለአድሚን ተልኳል!");
    showScreen("home");
  };
  document.getElementById("submitWithdraw").onclick = () => {
    alert("የWithdraw ጥያቄዎ ተልኳል!");
    showScreen("home");
  };
})();
</script>
</body>
</html>
