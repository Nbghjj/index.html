<script>
(() => {
  "use strict";
  const BACKEND_URL = "https://your-backend-api.com";
  const ADMIN_ID = "123456789"; // የAdmin Telegram User ID
  const STAKE = 20; // የመግቢያ ክፍያ
  
  const tg = window.Telegram?.WebApp;
  tg?.ready(); tg?.expand();

  const user = tg?.initDataUnsafe?.user || { id: "demo_user", first_name: "Test" };
  let selectedCard = null;

  // የስክሪን መለወጫ Function
  function showScreen(id) {
    document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
    const target = document.getElementById(id);
    if(target) target.classList.add("active");
  }

  // 1. JOIN ROOM አዝራር
  document.getElementById("joinBtn").onclick = () => {
    showScreen("select");
    buildCards();
  };

  // 2. 300 የቢንጎ ካርዶችን መገንቢያ Function
  function buildCards() {
    const box = document.getElementById("cards");
    if(!box) return;
    box.innerHTML = "";
    
    for(let i = 1; i <= 300; i++) {
      const b = document.createElement("button");
      b.className = "card";
      b.textContent = i;
      b.onclick = () => {
        selectedCard = i;
        document.querySelectorAll(".card").forEach(c => c.classList.remove("selected"));
        b.classList.add("selected");
        const startBtn = document.getElementById("startBtn");
        if(startBtn) startBtn.disabled = false;
      };
      box.appendChild(b);
    }
  }

  // 3. Navigation አዝራሮች
  document.getElementById("goDeposit").onclick = () => showScreen("deposit");
  document.getElementById("goWithdraw").onclick = () => showScreen("withdraw");
  
  const goAdmin = document.getElementById("goAdmin");
  if (goAdmin && String(user.id) === String(ADMIN_ID)) {
    goAdmin.style.display = "block";
    goAdmin.onclick = () => showScreen("admin");
  }

  document.querySelectorAll(".backHome").forEach(b => b.onclick = () => showScreen("home"));

})();
</script>
