<!DOCTYPE html>
<html lang="am">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>AYAT BINGO — Compact Card Selection</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;padding:12px;background:#120c24;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.container{max-width:480px;margin:auto}

.screen{display:none}
.screen.active{display:block !important}

.panel{background:#1f143a;border:1px solid #3c2a6d;border-radius:14px;padding:16px;margin-bottom:12px}
.hero{text-align:center;background:linear-gradient(135deg,#2c1b4d,#1f143a)}
.hero h1{margin:4px 0;color:#f39c12;font-size:28px}.muted{color:#a08cc4;font-size:13px}
.badge{display:inline-block;background:#27ae60;color:#fff;padding:5px 10px;border-radius:20px;font-size:11px}
.btn{width:100%;border:0;border-radius:9px;padding:14px;font-weight:700;font-size:15px;cursor:pointer;margin-top:8px}
.btn:disabled{opacity:0.4;cursor:not-allowed}
.primary{background:linear-gradient(135deg,#f39c12,#f1c40f);color:#111}
.green{background:#27ae60;color:#fff}.dark{background:#3c2a6d;color:#fff}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.input{width:100%;padding:12px;margin:6px 0 12px;border-radius:8px;border:1px solid #4b377d;background:#120c24;color:#fff;font-size:14px}
.bank-info{background:#2c1b4d;padding:10px;border-radius:8px;margin-bottom:12px;border-left:4px solid #f39c12}
.smallbtn{border:0;border-radius:7px;padding:8px 11px;background:#7928ca;color:#fff;font-weight:700;cursor:pointer}

/* Compact Dropdown & Selection Styling (Scroll የማያደርግ) */
.select-box{width:100%;padding:14px;background:#2c1b4d;border:2px solid #f39c12;border-radius:8px;color:#fff;font-size:16px;font-weight:700;outline:none;cursor:pointer;margin:8px 0 14px;}
.select-box option{background:#1f143a;color:#fff;padding:10px}
.card-display-badge{text-align:center;background:#27ae60;color:#fff;padding:10px;border-radius:8px;font-weight:800;font-size:18px;margin-bottom:12px}

/* Bingo Board CSS */
.bingo{background:#fff;color:#000;border:3px solid #ff69b4;border-radius:12px;padding:9px;max-width:350px;margin:0 auto}
.head{display:grid;grid-template-columns:repeat(5,1fr);background:#ff69b4;color:#fff;border-radius:6px;padding:6px;text-align:center;font-weight:800;font-size:18px}
.matrix{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-top:7px}
.cell{aspect-ratio:1;border:2px solid #000;border-radius:4px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;cursor:pointer;background:#fff}
.cell.free{background:#ff69b4;color:#fff}
.cell.marked{background:#f39c12;color:#000}
.ball{text-align:center;border:2px solid #f39c12;border-radius:14px;padding:12px;margin-bottom:12px}
.ballnum{font-size:38px;font-weight:900;color:#f39c12}
</style>
</head>
<body>

<main id="app" class="container">
  <!-- 1. HOME SCREEN -->
  <section id="home" class="screen active">
    <div class="panel hero">
      <h1>AYAT BINGO</h1>
      <p class="muted">የእውነተኛ ብር ቢንጎ ጨዋታ</p>
      <span class="badge">REAL MONEY GAME</span>
    </div>
    
    <div class="panel">
      <div class="top">
        <span class="muted">የእርስዎ ባላንስ:</span>
        <strong id="balance">100.00 ETB</strong>
      </div>
      <button id="goDeposit" class="btn green">ብር አስገባ (Deposit)</button>
      <button id="goWithdraw" class="btn dark">ብር አውጣ (Withdraw)</button>
    </div>

    <div class="panel">
      <div class="top">
        <div><b>Ayat Bingo Room</b><div class="muted">መግቢያ: 20 ETB</div></div>
      </div>
      <button id="joinBtn" class="btn primary">ጨዋታ ጀምር (JOIN ROOM)</button>
    </div>
  </section>

  <!-- 2. CARD SELECT SCREEN (COMPACT & NO SCROLL) -->
  <section id="select" class="screen">
    <div class="panel">
      <div class="top">
        <button class="smallbtn backHome">← ተመለስ</button>
        <b>ካርድ ይምረጡ (1–300)</b>
      </div>
      
      <!-- Option A: Direct Input -->
      <label class="muted" style="margin-top:12px;display:block;">1. የካርድ ቁጥር ይፃፉ፡</label>
      <input id="cardInput" type="number" min="1" max="300" class="input" placeholder="ከ 1 እስከ 300 ቁጥር ያስገቡ...">

      <div style="text-align:center;margin:4px 0;" class="muted">— ወይም —</div>

      <!-- Option B: Compact Dropdown List -->
      <label class="muted" style="display:block;">2. ከዝርዝሩ ውስጥ ይምረጡ፡</label>
      <select id="cardDropdown" class="select-box">
        <option value="">-- ካርድ ይምረጡ --</option>
      </select>

      <div id="statusBadge" class="card-display-badge" style="display:none;">
        የተመረጠው ካርድ፡ #<span id="cardNumTxt">--</span>
      </div>

      <button id="startBtn" class="btn primary" disabled>ካርዱን አረጋግጥና ጀምር</button>
    </div>
  </section>

  <!-- 3. GAME PLAY SCREEN -->
  <section id="game" class="screen">
    <div class="panel">
      <div class="top">
        <b>AYAT BINGO — LIVE</b>
        <button class="smallbtn backHome">ውጣ</button>
      </div>
      <div class="ball">
        <div class="muted">የተጠራው ቁጥር</div>
        <div id="ball" class="ballnum">--</div>
      </div>
      <div class="bingo">
        <div class="head"><span>B</span><span>I</span><span>N</span><span>G</span><span>O</span></div>
        <div id="matrix" class="matrix"></div>
        <div class="muted" style="text-align:center;margin-top:6px;color:#333;">Card #<span id="cardNoLabel">--</span></div>
      </div>
      <button id="claimBtn" class="btn green" style="margin-top:12px;">BINGO! 🎉</button>
    </div>
  </section>

  <!-- 4. DEPOSIT SCREEN -->
  <section id="deposit" class="screen">
    <div class="panel">
      <div class="top"><button class="smallbtn backHome">← ተመለስ</button><b>ብር ማስገቢያ</b></div>
      <div class="bank-info">
        <div><b>CBE:</b> 1000123456789</div>
        <div><b>Telebirr:</b> 0911000000</div>
      </div>
      <label class="muted">የያስገቡት መጠን (ETB)</label>
      <input type="number" class="input" placeholder="200">
      <label class="muted">Transaction Reference No.</label>
      <input type="text" class="input" placeholder="FT24XXXXXX">
      <button id="submitDeposit" class="btn green">ጥያቄውን ላክ</button>
    </div>
  </section>

  <!-- 5. WITHDRAW SCREEN -->
  <section id="withdraw" class="screen">
    <div class="panel">
      <div class="top"><button class="smallbtn backHome">← ተመለስ</button><b>ብር ማውጫ</b></div>
      <label class="muted">የባንክ / ቴሌብር ቁጥር</label>
      <input type="text" class="input" placeholder="የባንክ ሂሳብ ቁጥር">
      <label class="muted">የመጠኑ ብዛት (ETB)</label>
      <input type="number" class="input" placeholder="500">
      <button id="submitWithdraw" class="btn dark">የማውጣት ጥያቄ ላክ</button>
    </div>
  </section>
</main>

<script>
(() => {
  "use strict";
  const tg = window.Telegram?.WebApp;
  tg?.ready(); tg?.expand();

  let selectedCard = null;

  function showScreen(id) {
    document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
    const target = document.getElementById(id);
    if(target) target.classList.add("active");
  }

  // 1. Populating Dropdown Options (1-300)
  const dropdown = document.getElementById("cardDropdown");
  for (let i = 1; i <= 300; i++) {
    const opt = document.createElement("option");
    opt.value = i;
    opt.textContent = `Card #${i}`;
    dropdown.appendChild(opt);
  }

  // 2. Navigation & Actions
  document.getElementById("joinBtn").onclick = () => showScreen("select");

  function setSelected(num) {
    if(num >= 1 && num <= 300) {
      selectedCard = num;
      document.getElementById("cardNumTxt").textContent = num;
      document.getElementById("statusBadge").style.display = "block";
      document.getElementById("startBtn").disabled = false;
    } else {
      selectedCard = null;
      document.getElementById("statusBadge").style.display = "none";
      document.getElementById("startBtn").disabled = true;
    }
  }

  // Handle Input typing
  document.getElementById("cardInput").oninput = (e) => {
    const val = Number(e.target.value);
    dropdown.value = (val >= 1 && val <= 300) ? val : "";
    setSelected(val);
  };

  // Handle Dropdown select
  dropdown.onchange = (e) => {
    const val = Number(e.target.value);
    document.getElementById("cardInput").value = val || "";
    setSelected(val);
  };

  // Pseudo Generator Functions
  function rng(seed) {
    let x = seed >>> 0;
    return () => {
      x = (1664525 * x + 1013904223) >>> 0;
      return x / 4294967296;
    };
  }

  function getUniqueNumbers(min, max, count, seed) {
    const r = rng(seed), arr = [];
    while(arr.length < count) {
      let n = min + Math.floor(r() * (max - min + 1));
      if(!arr.includes(n)) arr.push(n);
    }
    return arr.sort((a, b) => a - b);
  }

  function generateBingoCard(cardId) {
    const s = cardId * 31337;
    return {
      B: getUniqueNumbers(1, 15, 5, s + 1),
      I: getUniqueNumbers(16, 30, 5, s + 2),
      N: getUniqueNumbers(31, 45, 4, s + 3),
      G: getUniqueNumbers(46, 60, 5, s + 4),
      O: getUniqueNumbers(61, 75, 5, s + 5)
    };
  }

  // Start Game Event
  document.getElementById("startBtn").onclick = () => {
    if(!selectedCard) return;
    showScreen("game");
    renderBoard(selectedCard);
  };

  function renderBoard(cardId) {
    const matrix = document.getElementById("matrix");
    matrix.innerHTML = "";
    document.getElementById("cardNoLabel").textContent = cardId;

    const data = generateBingoCard(cardId);

    for(let row = 0; row < 5; row++) {
      for(let col = 0; col < 5; col++) {
        const cell = document.createElement("div");
        cell.className = "cell";

        if(row === 2 && col === 2) {
          cell.textContent = "FREE";
          cell.classList.add("free", "marked");
        } else {
          let val;
          if(col === 0) val = data.B[row];
          else if(col === 1) val = data.I[row];
          else if(col === 2) val = data.N[row > 2 ? row - 1 : row];
          else if(col === 3) val = data.G[row];
          else if(col === 4) val = data.O[row];

          cell.textContent = val;
          cell.onclick = () => cell.classList.toggle("marked");
        }
        matrix.appendChild(cell);
      }
    }
  }

  // Navigation Event Listeners
  document.getElementById("goDeposit").onclick = () => showScreen("deposit");
  document.getElementById("goWithdraw").onclick = () => showScreen("withdraw");
  document.querySelectorAll(".backHome").forEach(b => b.onclick = () => showScreen("home"));

  document.getElementById("submitDeposit").onclick = () => {
    alert("የDeposit ጥያቄዎ ለአድሚን ተልኳል!");
    showScreen("home");
  };
  document.getElementById("submitWithdraw").onclick = () => {
    alert("የWithdraw ጥያቄዎ ተልኳል!");
    showScreen("home");
  };
})();
</script>
</body>
</html>
