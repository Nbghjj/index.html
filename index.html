<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <title>Ayat Bingo Mini App</title>

    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.8.2/css/all.min.css" rel="stylesheet" />
    <link href="https://bootswatch.com/5/spacelab/bootstrap.css" rel="stylesheet" id="themedStyle">
    <link href="css/style.css" rel="stylesheet">
</head>

<body>

    <!-- ያልተመዘገቡ ተጠቃሚዎችን የማገጃ ክፍል (Registration Check Layer) -->
    <div id="unregisteredOverlay" class="container text-center py-5" style="display: none;">
        <div class="alert alert-warning role="alert">
            <h4 class="alert-heading">⚠️ አልተመዘገቡም!</h4>
            <p>ቢንጎ ለመጫወት መጀመሪያ በ Telegram Bot በኩል ስልክ ቁጥርዎን Share ማድረግ አለብዎት።</p>
            <hr>
            <p class="mb-0">እባክዎን ወደ Bot ተመልሰው <b>📱 Share Contact</b> የሚለውን ተጫኑ።</p>
        </div>
    </div>

    <!-- የጨዋታው ዋና ክፍል (Main Game Container) -->
    <div class="container" id="gameContainer">
        <div class="row mb-2">

            <!-- የውርርድ (Bet) አዝራሮች -->
            <div class="col-md-12">
                <div class="btn-group form-control mb-2 animated fadeInDown" role="group" id="startGame">
                    <button type="button" class="btn btn-primary dealAmt" id="betAny" onClick="toggle('anyAmount');focusOnField('anyAmount');">Any $</button>
                    <button type="button" class="btn btn-primary" onClick="startGame(5)">$5</button>
                    <button type="button" class="btn btn-primary" onClick="startGame(10)">$10</button>
                    <button type="button" class="btn btn-primary" onClick="startGame(25)">$25</button>
                    <button type="button" class="btn btn-primary" onClick="startGame(50)">$50</button>
                    <button type="button" class="btn btn-primary" onClick="startGame(100)">$100</button>
                </div>
            </div>

            <!-- ብጁ መጠን ማስገቢያ (Any Amount Input) -->
            <div class="col-md-12 hide" data-toggle="anyAmount">
                <div class="input-group mb-3">
                    <input type="number" class="form-control" name="anyAmount" placeholder="Any Amount" onKeyUp="updateBetAny()">
                    <button class="btn btn-primary" onClick="startGame('any')">Bet</button>
                </div>
            </div>

            <!-- የሂሳብ መጠን እና የጨዋታ ሁኔታ -->
            <div class="col-md-12">
                <div class="alert alert-info" role="alert">
                    <div class="row">
                        <div class="col-4">
                            <h3>Balance: $<span id="playerMoney">100</span></h3>
                        </div>
                        <div class="col-4 text-center">
                            <h3 id="betTarget"></h3>
                        </div>
                        <div class="col-4 text-end">
                            <h3 id="selectedItem" class="text-uppercase">AYAT BINGO</h3>
                        </div>
                    </div>
                    <h3 id="announcement" class="text-uppercase text-center mt-2"></h3>
                </div>
            </div>

            <!-- የጨዋታ መቆጣጠሪያዎች (Controls) -->
            <div class="col-md-12">
                <div class="btn-group form-control mb-2 hide" role="group" id="playerOptions">
                    <button type="button" class="btn btn-primary" id="timerOn" onClick="toggleTimer()">Play with timer <i class="far fa-clock"></i></button>
                    <button type="button" class="btn btn-primary active" id="timerOff" onClick="toggleTimer()" disabled>Play at pace</button>
                    <button class="btn btn-primary px-0" onClick="startCalling('manual')" id="callSquare">Select Next Square</button>
                </div>
            </div>

            <!-- የተጠሩ ቁጥሮች ማሳያ -->
            <div class="col-md-12">
                <div id="calledList" class="mb-3"></div>
            </div>

            <!-- የተጫዋቾች የካርድ ቦታ (Players Grid) -->
            <div class="col-md-3">
                <div class="alert-light d-flex justify-content-center" id="player1"></div>
                <div class="text-center text-light alert-dark" data-details="1"></div>
            </div>
            <div class="col-md-3">
                <div class="alert-light d-flex justify-content-center" id="player2"></div>
                <div class="text-center text-light alert-dark" data-details="2"></div>
            </div>
            <div class="col-md-3">
                <div class="alert-light d-flex justify-content-center" id="player3"></div>
                <div class="text-center text-light alert-dark" data-details="3"></div>
            </div>
            <div class="col-md-3">
                <div class="alert-light d-flex justify-content-center" id="player4"></div>
                <div class="text-center text-light alert-dark" data-details="4"></div>
            </div>

            <!-- የህግ ማስገንዘቢያ (Rules Section) -->
            <div class="col-md-12 mt-3">
                <div class="d-grid gap-2">
                    <button class="btn btn-info" onClick="toggle('rules')" type="button">View Rules</button>
                </div>
                <div class="card hide mt-2" data-toggle="rules">
                    <div class="card-body">
                        <h5 class="card-title">Bingo Rules:</h5>
                        <p>Players can win by covering a complete horizontal, vertical, or diagonal line.</p>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- Telegram Mini App & Server Verification Script -->
    <script>
        // Telegram WebApp ን ማስነሳት
        const tg = window.Telegram ? window.Telegram.WebApp : null;
        if (tg) {
            tg.expand(); // Mini App ሙሉ ስክሪን እንዲሆን ያደርጋል
        }

        // Render ላይ ካለው Backend ጋር የትስስር ፍተሻ
        async function verifyUserRegistration() {
            if (!tg || !tg.initDataUnsafe || !tg.initDataUnsafe.user) {
                console.warn("Not running inside Telegram. Registration check skipped.");
                return;
            }

            const userId = tg.initDataUnsafe.user.id;

            try {
                // የራስህን የ Render URL እዚህ ጋር ማስገባት ትችላለህ (ወይም Relative Path መጠቀም ትችላለህ)
                const response = await fetch('/api/check-registration', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: userId })
                });

                const data = await response.json();

                if (!data.registered) {
                    // ተጠቃሚው ካልተመዘገበ የጨዋታውን ክፍል ደብቆ ማስጠንቀቂያውን ያሳያል
                    document.getElementById('gameContainer').style.display = 'none';
                    document.getElementById('unregisteredOverlay').style.display = 'block';
                }
            } catch (err) {
                console.error("Error verifying registration:", err);
            }
        }

        // ገጹ ሲከፈት ፍተሻውን ያስጀምራል
        window.onload = verifyUserRegistration;
    </script>

    <!-- የጨዋታው ዋና Script logic -->
    <script src="js/functionality.js"></script>
</body>

</html>
