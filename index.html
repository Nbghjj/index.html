<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ayat Bingo - Mini App</title>
    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #120c24;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 10px;
        }

        .container {
            max-width: 480px;
            margin: 0 auto;
        }

        /* Home Screen Styles */
        .card-banner {
            background: linear-gradient(135deg, #2c1b4d, #1f143a);
            padding: 20px;
            border-radius: 14px;
            text-align: center;
            border: 1px solid #3c2a6d;
            margin-bottom: 15px;
        }

        .card-banner h3 {
            color: #f39c12;
            margin: 0 0 5px 0;
            font-size: 22px;
        }

        .card-banner p {
            color: #a08cc4;
            font-size: 13px;
            margin: 0 0 10px 0;
        }

        .card-banner span {
            background: #3c2a6d;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            color: #f1c40f;
        }

        .room-box {
            background: #1f143a;
            padding: 15px;
            border-radius: 14px;
            border: 1px solid #3c2a6d;
        }

        .room-info h4 {
            margin: 5px 0;
            font-size: 16px;
        }

        .stake-badge {
            background: #f39c12;
            color: #000;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
        }

        .join-btn, .bingo-claim-btn {
            background: linear-gradient(135deg, #f39c12, #f1c40f);
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            color: #000;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
            font-size: 15px;
        }

        .bingo-claim-btn {
            background: linear-gradient(135deg, #2ecc71, #27ae60);
            color: white;
        }

        /* Selection Screen Styles */
        .game-top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1f143a;
            padding: 10px;
            border-radius: 10px;
            margin-bottom: 10px;
            border: 1px solid #3c2a6d;
        }

        .leave-btn {
            background: #7928ca;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .stats-box {
            display: flex;
            gap: 6px;
        }

        .stats-box span {
            background: #2c1b4d;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 11px;
            color: #f1c40f;
            border: 1px solid #3c2a6d;
        }

        .selection-info {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: #a08cc4;
            margin-bottom: 8px;
            padding: 0 5px;
        }

        .cards-grid-container {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 5px;
            max-height: 220px;
            overflow-y: auto;
            background: #1f143a;
            padding: 10px;
            border-radius: 10px;
            border: 1px solid #3c2a6d;
        }

        .card-box {
            background: #3c2a6d;
            color: #fff;
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            border: 1px solid #523a8a;
        }

        .card-box.selected {
            background: #f39c12;
            color: #000;
            border-color: #fff;
        }

        .card-box.taken {
            background: #444;
            color: #777;
            cursor: not-allowed;
            border-color: #333;
            text-decoration: line-through;
        }

        /* Live Game Styles */
        .live-game-layout {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .called-number-display {
            background: #1f143a;
            border: 2px solid #f39c12;
            border-radius: 14px;
            text-align: center;
            padding: 12px;
        }

        .current-ball {
            font-size: 32px;
            font-weight: bold;
            color: #f39c12;
            margin: 4px 0;
        }

        /* Rendered Card Design */
        .rendered-bingo-card {
            background: #ffffff;
            color: #000;
            border-radius: 10px;
            padding: 10px;
            border: 3px solid #ff69b4;
            max-width: 340px;
            margin: 0 auto;
        }

        .bingo-header-row {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            background: #ff69b4;
            border-radius: 6px;
            padding: 6px 0;
            text-align: center;
            font-weight: bold;
            color: #fff;
            font-size: 18px;
            margin-bottom: 8px;
        }

        .bingo-grid-matrix {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 5px;
        }

        .bingo-cell {
            background: #fff;
            border: 2px solid #000;
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
        }

        .bingo-cell.free-cell {
            background: #ff69b4;
            color: #fff;
        }

        .bingo-cell.marked {
            background: #f39c12 !important;
            color: #000;
            text-decoration: line-through;
        }

        .card-footer-banner {
            margin-top: 8px;
            border-top: 2px solid #000;
            padding-top: 5px;
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- 1. HOME SCREEN -->
    <div id="home-screen" class="container">
        <div class="card-banner">
            <h3>AYAT BINGO</h3>
            <p>Telegram Mini App Live Game.</p>
            <span>DEMO • 300 CARD CAPACITY</span>
        </div>
        
        <div class="room-box">
            <div class="room-info">
                <span class="stake-badge">20 BIRR</span>
                <h4>Ayat Bingo Room</h4>
                <p style="color: #a08cc4; font-size: 12px; margin: 2px 0;">• LIVE ROOM</p>
            </div>
            <p style="font-size: 13px; color: #a08cc4;">Players: <span id="player-count">64</span> / 300</p>
            <button id="joinRoomBtn" class="join-btn">JOIN ROOM →</button>
        </div>
    </div>

    <!-- 2. SELECTION SCREEN -->
    <div id="selection-screen" class="container" style="display: none;">
        <div class="game-top-bar">
            <button id="leaveBtn" class="leave-btn">← Leave</button>
            <h3 style="margin: 0; font-size: 14px; color: #f39c12;">Ayat Bingo</h3>
            <div class="stats-box">
                <span>W: <b id="wallet-val">500</b> Br</span>
                <span>S: <b id="stake-val">20</b> Br</span>
                <span>WIN: <b id="win-val">6000</b> Br</span>
            </div>
        </div>

        <div class="selection-info">
            <span id="boards-count">Boards: 0/1</span>
            <span id="timer-display" style="color: #f1c40f; font-weight: bold;">ካርድ ይምረጡ...</span>
        </div>

        <div class="cards-grid-container" id="cardsGrid"></div>
    </div>

    <!-- 3. LIVE GAME SCREEN -->
    <div id="live-game-screen" class="container" style="display: none;">
        <div class="game-top-bar">
            <h3 style="margin: 0; font-size: 14px; color: #f39c12;">Ayat Bingo - Live</h3>
            <button id="exitGameBtn" class="leave-btn">Exit</button>
        </div>

        <div class="live-game-layout">
            <div class="called-number-display">
                <p style="margin: 0; color: #a08cc4; font-size: 12px;">የተጠራው ቁጥር (Current Ball)</p>
                <div id="currentBall" class="current-ball">--</div>
                <p id="callStatus" style="margin: 0; font-size: 11px; color: #f1c40f;">ጨዋታው ተጀምሯል...</p>
            </div>

            <div class="rendered-bingo-card">
                <div class="bingo-header-row">
                    <span>B</span><span>I</span><span>N</span><span>G</span><span>O</span>
                </div>
                <div id="bingoMatrixGrid" class="bingo-grid-matrix"></div>
                <div class="card-footer-banner">
                    <span style="color: #e74c3c;">AYAT BINGO</span>
                    <span id="cardNumLabel">የካርቴል ቁጥር --</span>
                </div>
            </div>

            <button id="bingoClaimBtn" class="bingo-claim-btn">BINGO! (አሸነፍኩ)</button>
        </div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        if (tg) {
            tg.expand();
        }

        const totalBoards = 300;
        const maxSelection = 1;
        let selectedCards = [];
        let takenCards = new Set();
        let gameInterval = null;
        let countdownInterval = null;
        let currentCardData = null;
        let calledNumbersSet = new Set();
        let walletBalance = 500;
        const stakeAmount = 20;
        let timerStarted = false;

        const homeScreen = document.getElementById('home-screen');
        const selectionScreen = document.getElementById('selection-screen');
        const liveGameScreen = document.getElementById('live-game-screen');
        
        const joinRoomBtn = document.getElementById('joinRoomBtn');
        const leaveBtn = document.getElementById('leaveBtn');
        const exitGameBtn = document.getElementById('exitGameBtn');
        const bingoClaimBtn = document.getElementById('bingoClaimBtn');
        
        const gridContainer = document.getElementById('cardsGrid');
        const boardsCountText = document.getElementById('boards-count');
        const timerDisplay = document.getElementById('timer-display');
        const walletVal = document.getElementById('wallet-val');
        const winVal = document.getElementById('win-val');
        const currentBall = document.getElementById('currentBall');
        const callStatus = document.getElementById('callStatus');
        const bingoMatrixGrid = document.getElementById('bingoMatrixGrid');
        const cardNumLabel = document.getElementById('cardNumLabel');

        function generateCardData(cardId) {
            return {
                id: cardId,
                B: getRandomNumbers(1, 15, 5),
                I: getRandomNumbers(16, 30, 5),
                N: getRandomNumbers(31, 45, 4),
                G: getRandomNumbers(46, 60, 5),
                O: getRandomNumbers(61, 75, 5)
            };
        }

        function getRandomNumbers(min, max, count) {
            let nums = [];
            while(nums.length < count) {
                let r = Math.floor(Math.random() * (max - min + 1)) + min;
                if(!nums.includes(r)) nums.push(r);
            }
            return nums;
        }

        for (let i = 1; i <= totalBoards; i++) {
            const cardBtn = document.createElement('button');
            cardBtn.className = 'card-box';
            cardBtn.textContent = i;
            cardBtn.dataset.id = i;

            cardBtn.addEventListener('click', function() {
                const cardId = parseInt(this.dataset.id);
                if (takenCards.has(cardId)) {
                    alert("ይህ ካርድ በሌላ ተጫዋች ተይዟል!");
                    return;
                }

                if (selectedCards.includes(cardId)) {
                    selectedCards = selectedCards.filter(id => id !== cardId);
                    this.classList.remove('selected');
                } else {
                    if (selectedCards.length < maxSelection) {
                        selectedCards.push(cardId);
                        this.classList.add('selected');

                        // ተጫዋቹ የመጀመሪያውን ካርድ ሲመርጥ ብቻ የጋራ ቆጣሪውን ማስጀመር
                        if (!timerStarted) {
                            timerStarted = true;
                            startSharedCountdown();
                        }
                    } else {
                        alert(`እባክዎ ከ ${maxSelection} በላይ ካርድ መምረጥ አይችሉም!`);
                    }
                }
                boardsCountText.textContent = `Boards: ${selectedCards.length}/${maxSelection}`;
            });
            gridContainer.appendChild(cardBtn);
        }

        function resetSelectionScreen() {
            selectedCards = [];
            timerStarted = false;
            document.querySelectorAll('.card-box').forEach(btn => {
                let id = parseInt(btn.dataset.id);
                btn.classList.remove('selected');
                if (takenCards.has(id)) {
                    btn.classList.add('taken');
                } else {
                    btn.classList.remove('taken');
                }
            });
            boardsCountText.textContent = `Boards: 0/1`;
            timerDisplay.textContent = `ካርድ ይምረጡ...`;
            timerDisplay.style.color = '#f1c40f';
            walletVal.textContent = walletBalance;
            winVal.textContent = totalBoards * stakeAmount;
            clearInterval(countdownInterval);
        }

        // ሁሉም ተጫዋቾች በጋራ የሚቆጥሩበት የ 35 ሰከንድ ቆጣሪ
        function startSharedCountdown() {
            let timeLeft = 35;
            timerDisplay.textContent = `ጨዋታው ሊጀምር: ${timeLeft}ሰ`;
            timerDisplay.style.color = '#e74c3c';

            clearInterval(countdownInterval);
            countdownInterval = setInterval(() => {
                timeLeft--;
                if (timeLeft > 0) {
                    timerDisplay.textContent = `ጨዋታው ሊጀምር: ${timeLeft}ሰ`;
                } else {
                    clearInterval(countdownInterval);
                    
                    if (selectedCards.length > 0) {
                        if (walletBalance >= stakeAmount) {
                            walletBalance -= stakeAmount;
                            walletVal.textContent = walletBalance;
                            
                            selectedCards.forEach(id => takenCards.add(id));
                            launchLiveGame();
                        } else {
                            alert("ሂሳብዎ በቂ አይደለም!");
                            resetSelectionScreen();
                        }
                    } else {
                        resetSelectionScreen();
                    }
                }
            }, 1000);
        }

        joinRoomBtn.addEventListener('click', () => {
            homeScreen.style.display = 'none';
            selectionScreen.style.display = 'block';
            resetSelectionScreen();
        });

        leaveBtn.addEventListener('click', () => {
            clearInterval(countdownInterval);
            selectionScreen.style.display = 'none';
            homeScreen.style.display = 'block';
        });

        function launchLiveGame() {
            selectionScreen.style.display = 'none';
            liveGameScreen.style.display = 'block';
            
            const chosenId = selectedCards[0];
            currentCardData = generateCardData(chosenId);
            cardNumLabel.textContent = `የካርቴል ቁጥር ${chosenId}`;
            
            renderRenderedCard(currentCardData);
            startNumberCalling();
        }

        function getLetterForNumber(num) {
            if (num <= 15) return 'B';
            if (num <= 30) return 'I';
            if (num <= 45) return 'N';
            if (num <= 60) return 'G';
            return 'O';
        }

        function renderRenderedCard(cardObj) {
            bingoMatrixGrid.innerHTML = '';
            let matrixValues = [
                [cardObj.B[0], cardObj.I[0], cardObj.N[0], cardObj.G[0], cardObj.O[0]],
                [cardObj.B[1], cardObj.I[1], cardObj.N[1], cardObj.G[1], cardObj.O[1]],
                [cardObj.B[2], cardObj.I[2], 'F',          cardObj.G[2], cardObj.O[2]],
                [cardObj.B[3], cardObj.I[3], cardObj.N[2], cardObj.G[3], cardObj.O[3]],
                [cardObj.B[4], cardObj.I[4], cardObj.N[3], cardObj.G[4], cardObj.O[4]]
            ];

            matrixValues.forEach((row) => {
                row.forEach((val) => {
                    const cell = document.createElement('div');
                    cell.className = 'bingo-cell';
                    if (val === 'F') {
                        cell.textContent = '★';
                        cell.classList.add('free-cell', 'marked');
                    } else {
                        cell.textContent = val;
                        cell.addEventListener('click', function() {
                            if (calledNumbersSet.has(val)) {
                                this.classList.toggle('marked');
                            } else {
                                alert("ይህ ቁጥር ገና አልተጠራም!");
                            }
                        });
                    }
                    bingoMatrixGrid.appendChild(cell);
                });
            });
        }

        function startNumberCalling() {
            calledNumbersSet.clear();
            let pool = Array.from({length: 75}, (_, i) => i + 1).sort(() => Math.random() - 0.5);
            let idx = 0;
            callStatus.textContent = "ቁጥሮች እየተጠሩ ነው...";

            gameInterval = setInterval(() => {
                if (idx < pool.length) {
                    let num = pool[idx];
                    calledNumbersSet.add(num);
                    let letter = getLetterForNumber(num);
                    currentBall.textContent = `${letter}-${num}`;
                    idx++;
                } else {
                    clearInterval(gameInterval);
                    callStatus.textContent = "ዙሩ አልቋል!";
                }
            }, 2500);
        }

        bingoClaimBtn.addEventListener('click', () => {
            const cells = bingoMatrixGrid.querySelectorAll('.bingo-cell');
            let markedCount = 0;
            cells.forEach(c => {
                if (c.classList.contains('marked')) {
                    markedCount++;
                }
            });

            if (markedCount >= 5) {
                walletBalance += (totalBoards * stakeAmount);
                alert("🎉 እንኳን ደስ አለዎት! BINGO አሸንፈዋል!");
                if (tg && tg.close) {
                    tg.close();
                }
            } else {
                alert("⚠️ ገና አልተሞላም! ተጨማሪ ቁጥሮች ይጠብቁ።");
            }
        });

        exitGameBtn.addEventListener('click', () => {
            clearInterval(gameInterval);
            liveGameScreen.style.display = 'none';
            homeScreen.style.display = 'block';
            selectedCards = [];
            currentBall.textContent = '--';
        });
    </script>
</body>
    </html>
