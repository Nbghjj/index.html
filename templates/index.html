<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ayat Bingo - Live</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { background-color: #120c24; color: #fff; font-family: sans-serif; margin: 0; padding: 10px; }
        .container { max-width: 480px; margin: 0 auto; display: none; }
        .container.active-screen { display: block !important; }
        
        .card-banner { background: linear-gradient(135deg, #2c1b4d, #1f143a); padding: 20px; border-radius: 14px; text-align: center; border: 1px solid #3c2a6d; margin-bottom: 15px; }
        .wallet-box { background: #1f143a; padding: 15px; border-radius: 14px; margin-bottom: 15px; border: 1px solid #3c2a6d; }
        .wallet-row { display: flex; justify-content: space-between; align-items: center; }
        
        .game-top-bar { display: flex; justify-content: space-between; align-items: center; background: #1f143a; padding: 12px 15px; border-radius: 12px; margin-bottom: 15px; border: 1px solid #3c2a6d; }
        .leave-btn { background: #7928ca; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 13px; }
        
        .stats-box { display: flex; gap: 6px; align-items: center; }
        .stats-box span { background: #2c1b4d; padding: 4px 8px; border-radius: 6px; font-size: 11px; color: #f1c40f; border: 1px solid #3c2a6d; }

        .cards-grid-container { display: grid; grid-template-columns: repeat(10, 1fr); gap: 5px; max-height: 320px; overflow-y: auto; background: #1f143a; padding: 10px; border-radius: 10px; border: 1px solid #3c2a6d; }
        
        .card-box {
            background: #3c2a6d; color: #fff; aspect-ratio: 1; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: bold; border-radius: 4px; cursor: pointer; border: 1px solid #523a8a; transition: all 0.2s;
        }

        .card-box.selected { background: #f39c12 !important; color: #000 !important; border-color: #fff !important; box-shadow: 0 0 8px #f39c12; }
        .card-box.taken { background: #e74c3c !important; color: #fff !important; cursor: not-allowed !important; opacity: 0.7; }
        
        .join-btn { background: linear-gradient(135deg, #f39c12, #f1c40f); border: none; width: 100%; padding: 16px; border-radius: 10px; color: #000; font-weight: bold; font-size: 15px; cursor: pointer; margin-top: 15px; }
        .timer-badge { background: #e74c3c !important; color: #fff !important; font-weight: bold; display: inline-block !important; padding: 4px 10px; border-radius: 6px; }
        
        .gameplay-header { background: #1f143a; border: 1px solid #3c2a6d; padding: 12px 15px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        
        .called-number-box { background: #1f143a; border: 2px solid #f39c12; border-radius: 16px; padding: 20px; text-align: center; margin-bottom: 15px; box-shadow: 0 4px 20px rgba(0,0,0,0.4); }
        .called-num-title { font-size: 12px; color: #a08cc4; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }
        .called-num-value { font-size: 45px; font-weight: bold; color: #f39c12; margin: 0; line-height: 1; }
        .game-status-text { font-size: 12px; color: #2ecc71; margin-top: 6px; }

        #gameplayCardsContainer { max-height: 400px; overflow-y: auto; padding-right: 5px; }

        .bingo-card-wrapper { background: #ffffff; border-radius: 16px; padding: 12px; max-width: 320px; margin: 0 auto 15px auto; box-shadow: 0 6px 25px rgba(0,0,0,0.5); }
        .bingo-headers { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; margin-bottom: 5px; }
        .bingo-h-cell { background: #ff477e; color: white; text-align: center; font-weight: bold; padding: 8px 0; border-radius: 6px; font-size: 16px; }
        
        .bingo-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; }
        .bingo-cell { background: #ffe6ee; color: #333; aspect-ratio: 1; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 16px; border-radius: 6px; border: 1px solid #ffccd5; }
        .bingo-cell.marked { background: #000000 !important; color: #f39c12 !important; text-decoration: line-through; border-color: #000; }
        .bingo-cell.free-cell { background: #f39c12; color: #000; font-size: 14px; }
        
        .card-footer-label { text-align: center; color: #d63031; font-size: 12px; font-weight: bold; margin-top: 10px; }
        
        .bingo-action-btn { background: linear-gradient(135deg, #e74c3c, #c0392b); border: none; width: 100%; padding: 16px; border-radius: 12px; color: #fff; font-weight: bold; font-size: 18px; cursor: pointer; margin-top: 10px; box-shadow: 0 4px 15px rgba(231, 76, 60, 0.4); }
    </style>
</head>
<body>

    <!-- 1. HOME SCREEN -->
    <div id="home-screen" class="container active-screen">
        <div class="card-banner">
            <h3 style="color: #f39c12; margin: 0 0 5px 0;">AYAT BINGO</h3>
            <span style="background: #3c2a6d; padding: 4px 10px; border-radius: 20px; font-size: 11px; color: #f1c40f;">🎁 WELCOME BONUS: 100 BIRR</span>
        </div>
        
        <div class="wallet-box">
            <div class="wallet-row">
                <span style="font-size: 14px; color: #a08cc4;">የኪስ ቦርሳ (Wallet):</span>
                <span style="font-size: 18px; font-weight: bold; color: #2ecc71;"><b id="home-wallet-val">--</b> Birr</span>
            </div>
        </div>

        <button id="joinRoomBtn" class="join-btn" type="button" onclick="switchScreen('selection-screen')">JOIN ROOM →</button>
    </div>

    <!-- 2. SELECTION SCREEN -->
    <div id="selection-screen" class="container">
        <div class="game-top-bar">
            <button id="leaveBtn" class="leave-btn" type="button">← Leave</button>
            <h3 style="margin: 0; font-size: 14px; color: #f39c12;">እስከ 4 ካርዶች ይምረጡ</h3>
            <div class="stats-box">
                <span id="timer-box" class="timer-badge">⏱️ <b id="timer-val">45</b>s</span>
                <span>W: <b id="wallet-val">--</b> Br</span>
            </div>
        </div>

        <div style="display: flex; justify-content: space-between; color: #a08cc4; margin-bottom: 8px; font-size: 13px;">
            <span id="boards-count">Boards: 0/4</span>
            <span style="color: #2ecc71; font-weight: bold;">● 4 CARDS & AUTO-MARK LIVE</span>
        </div>

        <div class="cards-grid-container" id="cardsGrid"></div>
    </div>

    <!-- 3. GAMEPLAY SCREEN -->
    <div id="gameplay-screen" class="container">
        <div class="gameplay-header">
            <span style="color: #f39c12; font-weight: bold; font-size: 14px;">Ayat Bingo - Live</span>
            <button class="leave-btn" style="background: #e74c3c;" onclick="handleGameExit()">Exit</button>
        </div>

        <div class="called-number-box">
            <div class="called-num-title">Current Called Number</div>
            <div class="called-num-value" id="called-number-display">--</div>
            <div class="game-status-text" id="game-status-label">Auto-marking & Audio Active...</div>
        </div>

        <!-- የተመረጡት እስከ 4 የሚደርሱ ካርዶች እዚህ ይታያሉ -->
        <div id="gameplayCardsContainer"></div>

        <button class="bingo-action-btn" onclick="checkBingoWin()">BINGO! (ማንኛውንም ካርድ ያረጋግጡ)</button>
    </div>

    <script>
        function switchScreen(screenId) {
            document.querySelectorAll('.container').forEach(s => s.classList.remove('active-screen'));
            let target = document.getElementById(screenId);
            if(target) target.classList.add('active-screen');
        }

        let mySelectedCards = [];
        let takenCardsMap = {};
        let currentWallet = 0;
        let lastWinnerNotified = null;
        let calledNumbersSet = new Set();
        let currentGameStateStatus = "waiting";
        let userManuallyExited = false;
        let lastSpokenNumber = null;
        
        let telegramUser = localStorage.getItem("bingo_user_id");
        if (!telegramUser) {
            telegramUser = "user_" + Math.floor(Math.random() * 100000);
            localStorage.setItem("bingo_user_id", telegramUser);
        }

        let tg = window.Telegram ? window.Telegram.WebApp : null;
        if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) {
            telegramUser = tg.initDataUnsafe.user.id.toString();
        }

        // ቁጥር ሲጠራ በድምፅ እና በቺም ዜማ ማስታወቂያ መስጫ
        function speakNumberAndBingo(number) {
            if ('speechSynthesis' in window) {
                let utterance = new SpeechSynthesisUtterance(number.toString());
                utterance.rate = 1.0; 
                utterance.pitch = 1.1;
                window.speechSynthesis.speak(utterance);
            }
            playChimeSound();
        }

        function playChimeSound() {
            try {
                let audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                let osc = audioCtx.createOscillator();
                let gainNode = audioCtx.createGain();

                osc.type = 'sine';
                osc.frequency.setValueAtTime(587.33, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.15);

                gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);

                osc.connect(gainNode);
                gainNode.connect(audioCtx.destination);

                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            } catch(e) {
                console.error("Audio error", e);
            }
        }

        function generateCardNumbers(cardId) {
            let seed = parseInt(cardId) || 1;
            let rand = function() {
                seed = (seed * 9301 + 49297) % 233280;
                return seed / 233280;
            };

            let bNums = Array.from({length: 15}, (_, i) => i + 1).sort(() => rand() - 0.5).slice(0, 5);
            let iNums = Array.from({length: 15}, (_, i) => i + 16).sort(() => rand() - 0.5).slice(0, 5);
            let nNums = Array.from({length: 15}, (_, i) => i + 31).sort(() => rand() - 0.5).slice(0, 4);
            nNums.splice(2, 0, 'F');
            let gNums = Array.from({length: 15}, (_, i) => i + 46).sort(() => rand() - 0.5).slice(0, 5);
            let oNums = Array.from({length: 15}, (_, i) => i + 61).sort(() => rand() - 0.5).slice(0, 5);

            let gridNumbers = [];
            for (let r = 0; r < 5; r++) {
                gridNumbers.push(bNums[r]);
                gridNumbers.push(iNums[r]);
                gridNumbers.push(nNums[r]);
                gridNumbers.push(gNums[r]);
                gridNumbers.push(oNums[r]);
            }
            return gridNumbers;
        }

        function renderAllUserCardBoards() {
            let container = document.getElementById('gameplayCardsContainer');
            if (!container) return;
            container.innerHTML = '';

            if (mySelectedCards.length === 0) {
                container.innerHTML = '<div style="text-align:center; color:#a08cc4; padding:20px;">የመረጡት ካርድ የለም</div>';
                return;
            }

            mySelectedCards.forEach(cardId => {
                let wrapper = document.createElement('div');
                wrapper.className = 'bingo-card-wrapper';

                let headersHtml = `
                    <div class="bingo-headers">
                        <div class="bingo-h-cell">B</div>
                        <div class="bingo-h-cell">I</div>
                        <div class="bingo-h-cell">N</div>
                        <div class="bingo-h-cell">G</div>
                        <div class="bingo-h-cell">O</div>
                    </div>
                `;

                let gridDiv = document.createElement('div');
                gridDiv.className = 'bingo-grid';
                gridDiv.id = `card-grid-${cardId}`;

                let numbers = generateCardNumbers(cardId);
                numbers.forEach((num) => {
                    let cell = document.createElement('div');
                    cell.className = 'bingo-cell';
                    cell.textContent = num;
                    cell.dataset.value = num;

                    if (num === 'F') {
                        cell.classList.add('free-cell', 'marked');
                    } else {
                        let numInt = parseInt(num);
                        if (calledNumbersSet.has(numInt)) {
                            cell.classList.add('marked');
                        }
                    }
                    gridDiv.appendChild(cell);
                });

                let footer = document.createElement('div');
                footer.className = 'card-footer-label';
                footer.textContent = `ሲ.ቲ ቢንጎ የካርድ ቁጥር ${cardId}`;

                wrapper.innerHTML = headersHtml;
                wrapper.appendChild(gridDiv);
                wrapper.appendChild(footer);
                container.appendChild(wrapper);
            });
        }

        async function pollGameState() {
            try {
                let res = await fetch('/api/get_state');
                let gameState = await res.json();

                currentGameStateStatus = gameState.status;

                if (gameState.winner && gameState.winner !== lastWinnerNotified) {
                    lastWinnerNotified = gameState.winner;
                    userManuallyExited = false;
                    alert(`ጨዋታው አልቋል! አሸናፊው ተጫዋች በካርድ ቁጥር ${gameState.winning_card || '--'} አሸንፏል!`);
                    mySelectedCards = [];
                    calledNumbersSet.clear();
                    lastSpokenNumber = null;
                    switchScreen('selection-screen');
                    updateCardsUI();
                    fetchBalance();
                    return;
                }

                if (!gameState.winner) {
                    lastWinnerNotified = null;
                }

                if (gameState.current_called_number) {
                    let currentNum = gameState.current_called_number;
                    let numDisplay = document.getElementById('called-number-display');
                    if (numDisplay) numDisplay.textContent = currentNum;
                    
                    let parsedNum = parseInt(currentNum);
                    if (!calledNumbersSet.has(parsedNum)) {
                        calledNumbersSet.add(parsedNum);
                        
                        if (lastSpokenNumber !== currentNum) {
                            lastSpokenNumber = currentNum;
                            speakNumberAndBingo(currentNum);
                        }
                    }
                    
                    renderAllUserCardBoards();
                }

                if (gameState.status === "waiting") {
                    calledNumbersSet.clear();
                    lastSpokenNumber = null;
                    userManuallyExited = false;
                }

                if (gameState.taken_cards) {
                    takenCardsMap = gameState.taken_cards;
                    let foundCards = [];
                    for (let cardId in takenCardsMap) {
                        if (String(takenCardsMap[cardId]) === String(telegramUser)) {
                            foundCards.push(cardId);
                        }
                    }
                    mySelectedCards = foundCards;
                    
                    updateCardsUI();
                    let boardCountEl = document.getElementById('boards-count');
                    if(boardCountEl) boardCountEl.textContent = `Boards: ${mySelectedCards.length}/4`;
                }

                let timerEl = document.getElementById('timer-val');
                if (timerEl) {
                    timerEl.textContent = gameState.timer;
                }

                let activeScreenEl = document.querySelector('.container.active-screen');
                let currentActive = activeScreenEl ? activeScreenEl.id : 'home-screen';

                if (gameState.status === "playing") {
                    let hasCards = mySelectedCards.length > 0;

                    if (hasCards) {
                        if (currentActive !== 'gameplay-screen' && !userManuallyExited) {
                            renderAllUserCardBoards();
                            switchScreen('gameplay-screen');
                        }
                    } else {
                        if (currentActive === 'gameplay-screen') {
                            switchScreen('home-screen');
                        }
                    }
                } else {
                    userManuallyExited = false;
                    if (currentActive === 'gameplay-screen') {
                        switchScreen('selection-screen');
                    }
                }

            } catch(e) {
                console.error("Polling Error", e);
            }
        }

        function updateCardsUI() {
            document.querySelectorAll('.card-box').forEach(btn => {
                let cardId = btn.dataset.id;
                btn.classList.remove('taken', 'selected');

                if (mySelectedCards.includes(cardId)) {
                    btn.classList.add('selected');
                } else if (takenCardsMap[cardId] && String(takenCardsMap[cardId]) !== String(telegramUser)) {
                    btn.classList.add('taken');
                }
            });
        }

        function verifyBingoWinForGrid(gridEl) {
            let cells = gridEl.querySelectorAll('.bingo-cell');
            if (cells.length !== 25) return false;

            let grid = [];
            for (let i = 0; i < 5; i++) {
                grid.push([]);
                for (let j = 0; j < 5; j++) {
                    let cell = cells[i * 5 + j];
                    grid[i].push(cell.classList.contains('marked'));
                }
            }

            for (let i = 0; i < 5; i++) {
                if (grid[i][0] && grid[i][1] && grid[i][2] && grid[i][3] && grid[i][4]) return true;
            }
            for (let j = 0; j < 5; j++) {
                if (grid[0][j] && grid[1][j] && grid[2][j] && grid[3][j] && grid[4][j]) return true;
            }
            if (grid[0][0] && grid[1][1] && grid[2][2] && grid[3][3] && grid[4][4]) return true;
            if (grid[0][4] && grid[1][3] && grid[2][2] && grid[3][1] && grid[4][0]) return true;

            return false;
        }

        async function checkBingoWin() {
            if (mySelectedCards.length === 0) {
                alert("የመረጡት ካርድ የለም!");
                return;
            }

            let winningCardId = null;
            for (let cardId of mySelectedCards) {
                let gridEl = document.getElementById(`card-grid-${cardId}`);
                if (gridEl && verifyBingoWinForGrid(gridEl)) {
                    winningCardId = cardId;
                    break;
                }
            }

            if (!winningCardId) {
                alert("❌ ከእርስዎ ካርዶች መካከል አንዳቸውም ገና ቢንጎ አልሞሉም!");
                return;
            }

            try {
                let res = await fetch('/api/bingo_win', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ user_id: telegramUser, card_id: winningCardId })
                });
                let result = await res.json();
                if (result.success) {
                    alert(result.message);
                    mySelectedCards = [];
                    calledNumbersSet.clear();
                    lastSpokenNumber = null;
                    switchScreen('selection-screen');
                    updateCardsUI();
                    fetchBalance();
                } else {
                    alert(result.message || "ቢንጎ ማረጋገጥ አልተቻለም!");
                }
            } catch (e) {
                alert("የኔትወርክ ችግር ተፈጥሯል!");
            }
        }

        async function fetchBalance() {
            try {
                let res = await fetch('/api/get_balance', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ user_id: telegramUser })
                });
                let data = await res.json();
                currentWallet = data.balance;
                updateWalletUI();
            } catch (e) {
                console.error("Balance Fetch Error", e);
            }
        }

        function updateWalletUI() {
            let hw = document.getElementById('home-wallet-val');
            let ww = document.getElementById('wallet-val');
            if(hw) hw.textContent = currentWallet;
            if(ww) ww.textContent = currentWallet;
        }

        async function handleGameExit() {
            if (currentGameStateStatus === 'playing') {
                userManuallyExited = true;
                alert("ጨዋታው በሂደት ላይ ስለሆነ ካርዶችዎ ይዘው ይቀጥላሉ፤ ወደ ካርድ መረጣው ተመልሰዋል።");
                switchScreen('selection-screen');
            } else {
                userManuallyExited = false;
                await unlockAllCards();
                switchScreen('selection-screen');
            }
        }

        document.addEventListener("DOMContentLoaded", function() {
            const totalBoards = 300;
            const gridContainer = document.getElementById('cardsGrid');

            if (gridContainer) {
                for (let i = 1; i <= totalBoards; i++) {
                    const btn = document.createElement('button');
                    btn.className = 'card-box';
                    btn.textContent = i;
                    btn.dataset.id = i;
                    btn.onclick = () => handleCardClick(i);
                    gridContainer.appendChild(btn);
                }
            }

            async function handleCardClick(cardId) {
                let stringCardId = String(cardId);
                
                if (mySelectedCards.includes(stringCardId)) {
                    await unlockCard(stringCardId);
                } else {
                    if (mySelectedCards.length >= 4) {
                        alert("እስከ 4 ካርዶች ብቻ መያዝ ይቻላል!");
                        return;
                    }

                    let res = await fetch('/api/lock_card', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({ card_id: cardId, user_id: telegramUser })
                    });
                    
                    let result = await res.json();
                    if (res.ok && result.success) {
                        if (!mySelectedCards.includes(stringCardId)) {
                            mySelectedCards.push(stringCardId);
                        }
                        currentWallet = result.new_balance;
                        updateWalletUI();
                    } else {
                        alert(result.message || "ይህ ካርድ መያዝ አልተቻለም!");
                    }
                }
                
                let bc = document.getElementById('boards-count');
                if(bc) bc.textContent = `Boards: ${mySelectedCards.length}/4`;
                updateCardsUI();
            }

            async function unlockCard(cardId) {
                let res = await fetch('/api/unlock_card', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ card_id: cardId, user_id: telegramUser })
                });
                let data = await res.json();
                if (data.success) {
                    currentWallet = data.new_balance;
                    updateWalletUI();
                }
                mySelectedCards = mySelectedCards.filter(id => id !== String(cardId));
                let bc = document.getElementById('boards-count');
                if(bc) bc.textContent = `Boards: ${mySelectedCards.length}/4`;
                updateCardsUI();
            }

            async function unlockAllCards() {
                for (let cardId of [...mySelectedCards]) {
                    await unlockCard(cardId);
                }
            }

            fetchBalance();
            setInterval(pollGameState, 1000);

            let leaveBtn = document.getElementById('leaveBtn');
            if(leaveBtn) {
                leaveBtn.onclick = async () => {
                    await unlockAllCards();
                    switchScreen('home-screen');
                };
            }
        });
    </script>
</body>
</html>
